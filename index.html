<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#070b12"/>
<title>Larp Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #070b12;
  --card: rgba(12, 18, 30, 0.82);
  --border: rgba(90, 150, 255, 0.22);
  --border-soft: rgba(120, 170, 255, 0.14);
  --text: #edf2fa;
  --muted: #7d8fa8;
  --blue: #4da3ff;
  --blue2: #6bb8ff;
  --cyan: #3dd6c6;
  --glow: rgba(77, 163, 255, 0.35);
  --danger: #ff5c7a;
  --win: #3dd68c;
  --safe: env(safe-area-inset-bottom, 0px);
  --nav-h: 70px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{
  height:100%;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(ellipse 100% 50% at 50% -20%, rgba(40,100,200,.13), transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(30,80,160,.06), transparent),
    var(--bg);
  overflow:hidden;
}

/* ===== FLOATING PARTICLES ===== */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(120,180,255,.55);
  box-shadow:0 0 6px rgba(100,170,255,.4);
  animation:float linear infinite;
  opacity:0;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.6}
  90%{opacity:.4}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav-h)+var(--safe)+14px);-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.fade{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== CARDS — thin blue outline + soft glow ===== */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 4px 28px rgba(0,0,0,.4),
    0 0 0 0.5px rgba(120,170,255,.08),
    inset 0 1px 0 rgba(255,255,255,.04);
}

/* ===== NAV — sliding pill like video ===== */
.nav-wrap{
  position:fixed;left:0;right:0;bottom:0;
  padding:0 14px calc(10px + var(--safe));
  z-index:100;pointer-events:none;
}
.nav{
  pointer-events:auto;
  position:relative;
  display:flex;align-items:center;
  height:58px;
  padding:5px;
  border-radius:29px;
  background:rgba(8,12,20,.82);
  border:1px solid rgba(130,170,230,.16);
  backdrop-filter:blur(32px) saturate(1.6);
  -webkit-backdrop-filter:blur(32px) saturate(1.6);
  box-shadow:
    0 10px 40px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.05);
}
.nav-pill{
  position:absolute;
  top:5px;left:5px;
  height:calc(100% - 10px);
  width:calc(33.333% - 3.33px);
  border-radius:24px;
  background:rgba(14,20,34,.98);
  border:1px solid rgba(140,185,255,.28);
  box-shadow:
    0 2px 14px rgba(0,0,0,.5),
    0 0 18px rgba(70,140,255,.15),
    inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .36s cubic-bezier(.32,.72,.25,1);
  z-index:0;pointer-events:none;
}
.nav-item{
  position:relative;z-index:1;
  flex:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;cursor:pointer;
  color:rgba(150,170,200,.42);
  font-size:10.5px;font-weight:600;
  transition:color .3s ease;
}
.nav-item.active{color:#6bb8ff}
.nav-item svg{
  width:21px;height:21px;
  stroke:currentColor;fill:none;stroke-width:1.7;
  transition:transform .3s ease, filter .3s ease;
}
.nav-item.active svg{
  filter:drop-shadow(0 0 8px rgba(90,170,255,.75));
  transform:scale(1.08);
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;
  font-weight:600;font-size:15px;border:none;cursor:pointer;color:inherit;
  transition:transform .15s, box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,#3d8bfd 0%,#2a6adf 100%);
  color:#fff;
  border:1px solid rgba(140,190,255,.3);
  box-shadow:0 4px 22px rgba(61,139,253,.4), 0 0 0 0.5px rgba(100,160,255,.15);
}
.btn-ghost{
  background:rgba(60,130,220,.08);
  border:1px solid rgba(100,160,255,.25);
  color:var(--blue);
  box-shadow:0 0 12px rgba(70,140,255,.08);
}
.btn-danger{
  background:rgba(255,92,122,.08);
  border:1px solid rgba(255,92,122,.28);
  color:var(--danger);
}
.btn-block{width:100%}
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.h2{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:13px}

/* ===== RANK ===== */
.rank{
  display:inline-flex;padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.05em;
  background:rgba(60,130,220,.12);
  color:var(--blue2);
  border:1px solid rgba(100,160,255,.3);
  box-shadow:0 0 14px rgba(70,150,255,.18);
}

/* ===== AVATAR ===== */
.avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,#15253f,#1e3558);
  border:1.5px solid rgba(110,170,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;color:var(--blue);
  flex-shrink:0;overflow:hidden;
  box-shadow:0 0 18px rgba(60,130,255,.18), inset 0 0 12px rgba(40,100,200,.1);
  position:relative;
}
.avatar-lg{width:100px;height:100px;font-size:38px;border-width:2px}
.avatar-sm{width:40px;height:40px;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-orbit{
  position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:rgba(90,170,255,.7);
  border-right-color:rgba(70,200,190,.35);
  animation:spin 3.2s linear infinite;
  pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(80,160,255,.4));
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== BILLBOARD ===== */
.bb-wrap{margin-bottom:16px}
.bb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.bb-track::-webkit-scrollbar{display:none}
.bb{
  min-width:100%;scroll-snap-align:start;height:120px;border-radius:16px;padding:20px;
  display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid var(--border);
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.3), 0 0 20px rgba(50,120,220,.08);
}
.bb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(77,163,255,.22),transparent 55%);pointer-events:none}
.bb-title{font-size:19px;font-weight:700;position:relative;z-index:1}
.bb-sub{font-size:13px;color:rgba(255,255,255,.65);position:relative;z-index:1;margin-top:2px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .25s,box-shadow .25s}
.dot.on{background:var(--blue);box-shadow:0 0 8px var(--glow)}

/* ===== ARENA CARDS ===== */
.arena{padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.arena::before{content:'';position:absolute;top:-30%;right:-15%;width:140px;height:140px;border-radius:50%;opacity:.1;pointer-events:none}
.arena-larp::before{background:#3dd6c6}
.arena-mog::before{background:#4da3ff}
.arena-title{font-size:19px;font-weight:800;letter-spacing:.03em;margin-bottom:6px}
.arena-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.45}

/* ===== SEARCH ===== */
.search-wrap{display:flex;flex-direction:column;align-items:center;padding-top:56px;gap:22px}
.ring{width:144px;height:144px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring-orbit{
  position:absolute;inset:-6px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--blue);
  border-right-color:var(--cyan);
  animation:spin 1.35s linear infinite;
  box-shadow:0 0 20px var(--glow);
  filter:drop-shadow(0 0 6px rgba(80,160,255,.3));
}
.pulse{animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

/* ===== BATTLE / RESULT ===== */
.vs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0}
.vs-player{flex:1;text-align:center}
.vs-badge{font-size:20px;font-weight:800;color:var(--muted);letter-spacing:.12em}
.score-big{font-size:26px;font-weight:800;margin-top:6px;background:linear-gradient(135deg,#4da3ff,#3dd6c6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-win{color:var(--win);font-size:30px;font-weight:900;letter-spacing:.06em;text-shadow:0 0 24px rgba(61,214,140,.5);text-align:center}
.result-loss{color:var(--danger);font-size:30px;font-weight:900;letter-spacing:.06em;text-shadow:0 0 24px rgba(255,92,122,.4);text-align:center}

/* ===== PROFILE ===== */
.profile-header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0 18px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat-box{padding:14px;text-align:center}
.stat-val{font-size:20px;font-weight:700}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px}
.energy-line{width:52px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(100,170,255,.55),transparent);margin-top:4px}

/* ===== LEADERBOARD ===== */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:background .2s,border-color .2s}
.lb-row:active{background:rgba(70,140,255,.06)}
.lb-place{width:26px;font-weight:700;font-size:13px;color:var(--muted);text-align:center}
.lb-place.top{color:var(--blue)}

/* ===== HISTORY ===== */
.hist{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:8px}

/* ===== CHAT ===== */
.chat-msg{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.chat-bubble{
  background:rgba(12,18,30,.92);
  border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;max-width:80%;font-size:14px;line-height:1.4;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.chat-meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.chat-input-wrap{display:flex;gap:8px;margin-top:12px}
.chat-input{
  flex:1;background:rgba(12,18,30,.95);
  border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.chat-input:focus{border-color:rgba(100,160,255,.45);box-shadow:0 0 0 3px rgba(70,140,255,.1)}

/* ===== TOGGLE ===== */
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px;margin-bottom:10px}
.toggle-sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);position:relative;transition:background .25s;cursor:pointer;border:1px solid rgba(120,160,220,.15)}
.toggle-sw.on{background:rgba(61,139,253,.4);border-color:rgba(100,160,255,.35)}
.toggle-kn{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle-sw.on .toggle-kn{transform:translateX(18px)}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 16px 16px;padding:20px;width:100%;max-width:400px;backdrop-filter:blur(24px);box-shadow:0 -8px 40px rgba(0,0,0,.4)}
.rank-up{animation:rankPulse 1.2s ease}
@keyframes rankPulse{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <div class="particles" id="particles"></div>
</div>
<script>
(function(){
  // Particles
  (function(){
    const c=document.getElementById('particles');
    if(!c) return;
    for(let i=0;i<14;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=Math.random()*100+'%';
      p.style.animationDuration=(12+Math.random()*18)+'s';
      p.style.animationDelay=(Math.random()*12)+'s';
      p.style.width=p.style.height=(1.5+Math.random()*2)+'px';
      c.appendChild(p);
    }
  })();

  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();if(tg.expand)tg.expand();try{if(tg.setHeaderColor)tg.setHeaderColor('#070b12');if(tg.setBackgroundColor)tg.setBackgroundColor('#070b12')}catch(e){}}

  function haptic(t){try{const hf=tg&&tg.HapticFeedback;if(!hf)return;if(t==='success'||t==='error')hf.notificationOccurred(t);else hf.impactOccurred(t==='medium'?'medium':'light')}catch(e){}}

  let audioCtx=null;
  function playSound(type){
    try{
      if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      if(type==='win'){o.frequency.setValueAtTime(523,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(784,audioCtx.currentTime+.15);g.gain.setValueAtTime(.14,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.4);o.start();o.stop(audioCtx.currentTime+.4)}
      else{o.frequency.setValueAtTime(300,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+.3);g.gain.setValueAtTime(.11,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);o.start();o.stop(audioCtx.currentTime+.35)}
    }catch(e){}
  }

  function getRank(pts){if(pts>=2000)return'TRUE ADAM';if(pts>=1000)return'CHAD';if(pts>=500)return'HTN';if(pts>=150)return'LTN';return'SAB'}
  function ptsToNext(pts){const m=[50,150,500,1000,2000],n=['SAB','LTN','HTN','CHAD','TRUE ADAM'];if(pts<50)return{next:'SAB',need:50-pts};for(let i=0;i<m.length-1;i++)if(pts>=m[i]&&pts<m[i+1])return{next:n[i+1],need:m[i+1]-pts};return{next:null,need:0}}
  function makeScores(seed){const r=n=>Math.round((3.2+((seed*n*17)%65)/10)*100)/100;return{avatar:r(1),username:r(2),bio:r(3),gifts:r(4),giftValue:r(5),accountAge:r(6),telegramLevel:r(7)}}
  function overall(s){const v=[s.avatar,s.username,s.bio,s.gifts,s.giftValue,s.accountAge,s.telegramLevel];return Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100}

  const RAW=[
    {id:1,username:'raizen',pts:2450,winStreak:17,wins:42,losses:8,battlesPlayed:50,isPremium:true,telegramLevel:10,accountYear:2014,giftsCount:12,giftsValueUsd:2700},
    {id:2,username:'Mr_mkfr',pts:380,winStreak:0,wins:5,losses:12,battlesPlayed:17,isPremium:false,telegramLevel:4,accountYear:2022,giftsCount:21,giftsValueUsd:380},
    {id:3,username:'neon',pts:1120,winStreak:5,wins:28,losses:11,battlesPlayed:39,isPremium:true,telegramLevel:8,accountYear:2018,giftsCount:9,giftsValueUsd:890},
    {id:4,username:'voidx',pts:620,winStreak:2,wins:15,losses:9,battlesPlayed:24,isPremium:false,telegramLevel:6,accountYear:2019,giftsCount:6,giftsValueUsd:420},
    {id:5,username:'sakura',pts:180,winStreak:3,wins:8,losses:4,battlesPlayed:12,isPremium:true,telegramLevel:5,accountYear:2020,giftsCount:15,giftsValueUsd:210},
    {id:6,username:'chadgod',pts:1580,winStreak:9,wins:35,losses:6,battlesPlayed:41,isPremium:true,telegramLevel:12,accountYear:2015,giftsCount:20,giftsValueUsd:4500},
    {id:7,username:'pixel',pts:95,winStreak:1,wins:3,losses:5,battlesPlayed:8,isPremium:false,telegramLevel:2,accountYear:2023,giftsCount:4,giftsValueUsd:45},
    {id:8,username:'onyx',pts:890,winStreak:4,wins:22,losses:10,battlesPlayed:32,isPremium:true,telegramLevel:7,accountYear:2017,giftsCount:11,giftsValueUsd:1200},
    {id:9,username:'lumen',pts:2100,winStreak:12,wins:48,losses:7,battlesPlayed:55,isPremium:true,telegramLevel:11,accountYear:2013,giftsCount:18,giftsValueUsd:8900},
    {id:10,username:'ghost',pts:40,winStreak:0,wins:1,losses:6,battlesPlayed:7,isPremium:false,telegramLevel:1,accountYear:2024,giftsCount:2,giftsValueUsd:12},
  ];
  const PLAYERS=RAW.map((p,i)=>{let scores=makeScores(p.id*13+i);if(p.pts>=2000)scores={avatar:8.2,username:9.5,bio:7.0,gifts:9.1,giftValue:9.4,accountAge:9.6,telegramLevel:8.5};return{...p,rank:getRank(p.pts),scores,overallScore:overall(scores)}});
  const BB=[
    {title:'New Season',sub:'x2.5 PTS Weekend',g:'linear-gradient(135deg,#1a3a5c,#0d1b2a 50%,#1b4d6e)'},
    {title:'MOG Arena',sub:'Full profile battles',g:'linear-gradient(135deg,#2a1a4a,#0d1b2a 50%,#3d2a6b)'},
    {title:'LARP Arena',sub:'Gifts collection wars',g:'linear-gradient(135deg,#1a4a3a,#0d1b2a 50%,#1b6e4d)'},
  ];

  let user=null;
  try{const r=localStorage.getItem('larp_user');if(r)user=JSON.parse(r)}catch(e){}
  if(!user){
    const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(tgUser){user={id:tgUser.id,username:tgUser.username||(tgUser.first_name||'player').toLowerCase(),firstName:tgUser.first_name||'',photoUrl:tgUser.photo_url||null,isPremium:!!tgUser.is_premium,pts:50,winStreak:0,wins:0,losses:0,battlesPlayed:0,hideFromLB:false,scores:makeScores(tgUser.id||1)};user.rank=getRank(user.pts);user.overallScore=overall(user.scores)}
    else user={...PLAYERS[0],photoUrl:null,hideFromLB:false};
  }
  user.rank=getRank(user.pts);

  let history=[];try{const r=localStorage.getItem('larp_hist');if(r)history=JSON.parse(r)}catch(e){}
  if(!history.length)history=[{id:'h1',opponent:'Mr_mkfr',mode:'MOG',result:'WIN',ptsDelta:25,date:'2026-08-07'},{id:'h2',opponent:'neon',mode:'LARP',result:'WIN',ptsDelta:25,date:'2026-08-06'},{id:'h3',opponent:'chadgod',mode:'MOG',result:'LOSS',ptsDelta:-25,date:'2026-08-05'}];

  let chatMessages=[];try{const r=localStorage.getItem('larp_chat');if(r)chatMessages=JSON.parse(r)}catch(e){}
  if(!chatMessages.length)chatMessages=[{id:1,user:'lumen',text:'Кто на LARP?',time:'14:20'},{id:2,user:'chadgod',text:'MOG only 🔥',time:'14:22'},{id:3,user:'neon',text:'Ищу достойного',time:'14:25'}];
  let chatSentTimes=[];try{const r=localStorage.getItem('larp_chat_times');if(r)chatSentTimes=JSON.parse(r)}catch(e){}

  function save(){try{localStorage.setItem('larp_user',JSON.stringify(user));localStorage.setItem('larp_hist',JSON.stringify(history.slice(0,50)));localStorage.setItem('larp_chat',JSON.stringify(chatMessages.slice(-100)));localStorage.setItem('larp_chat_times',JSON.stringify(chatSentTimes.slice(-20)))}catch(e){}}

  let screen='arenas',mode='MOG',opponent=null,searchSec=0,searchIv=null;
  let barVis=0,myScores=null,oppScores=null,myOv=0,oppOv=0,winnerId=null;
  let commentary='',tips=[],viewPlayer=null,bbIdx=0,navIndex=0;
  let showChallengeModal=false,challengeTarget=null,prevRank=null,showRankUp=false;

  function avatarHTML(name,cls,photoUrl){const letter=(name||'?')[0].toUpperCase();if(photoUrl)return'<div class="avatar '+(cls||'')+'"><img src="'+photoUrl+'" alt=""/></div>';return'<div class="avatar '+(cls||'')+'">'+letter+'</div>'}
  function jitter(b){return Math.round(Math.min(10,Math.max(1,b+(Math.random()-.5)*.75))*100)/100}
  function computeScores(p,m){const s={...p.scores};if(m==='LARP'){s.gifts=jitter(s.gifts+.2);s.giftValue=jitter(s.giftValue+.3)}else{s.avatar=jitter(s.avatar+.1);s.username=jitter(s.username+.1)}return s}
  function overallMode(s,m){if(m==='LARP')return Math.round(Math.min(10,s.gifts*.26+s.giftValue*.24+s.avatar*.1+s.username*.1+s.bio*.06+s.accountAge*.12+s.telegramLevel*.12)*100)/100;return overall(s)}
  function findOpp(){const o=PLAYERS.filter(p=>p.id!==user.id).sort((a,b)=>Math.abs(a.pts-user.pts)-Math.abs(b.pts-user.pts));return o.slice(0,4)[Math.floor(Math.random()*Math.min(4,o.length))]||o[0]}
  function applyPts(isWin){prevRank=user.rank;user.pts=Math.max(0,user.pts+(isWin?25:-25));user.rank=getRank(user.pts);if(isWin){user.wins++;user.winStreak++}else{user.losses++;user.winStreak=0}user.battlesPlayed++;if(prevRank!==user.rank&&isWin)showRankUp=true;save()}

  function go(s){haptic('light');screen=s;if(s==='arenas')navIndex=0;else if(s==='leaderboard')navIndex=1;else if(s==='profile')navIndex=2;showChallengeModal=false;render()}
  function showNav(){return['arenas','leaderboard','profile','chat'].indexOf(screen)>=0}

  function startSearch(m){haptic('medium');mode=m;opponent=null;searchSec=0;screen='search';render();if(searchIv)clearInterval(searchIv);const t0=Date.now();searchIv=setInterval(function(){searchSec=Math.floor((Date.now()-t0)/1000);if(searchSec>=2+Math.floor(Math.random()*2)&&!opponent){clearInterval(searchIv);opponent=findOpp();haptic('success');render();setTimeout(function(){startBattle(mode,opponent)},1100)}else if(searchSec>=60&&!opponent){clearInterval(searchIv);render()}else if(!opponent&&searchSec%2===0){const el=document.getElementById('searchTimer');if(el){const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');el.textContent=mode+' · '+mm+':'+ss}}},500)}
  function cancelSearch(){if(searchIv)clearInterval(searchIv);haptic('light');go('arenas')}

  function startBattle(m,opp){opponent=opp;barVis=0;myScores=computeScores(user,m);oppScores=computeScores(opp,m);myOv=overallMode(myScores,m);oppOv=overallMode(oppScores,m);winnerId=myOv>=oppOv?user.id:opp.id;const reasons=[];const ws=winnerId===user.id?myScores:oppScores;const ls=winnerId===user.id?oppScores:myScores;if(ws.username>ls.username+.4)reasons.push('более сильный username');if(ws.gifts>ls.gifts+.4)reasons.push('более сильная коллекция Gifts');if(ws.giftValue>ls.giftValue+.4)reasons.push('выше ценность Gifts');if(ws.avatar>ls.avatar+.4)reasons.push('лучший аватар');if(!reasons.length)reasons.push('общий баланс профиля');commentary='Победа благодаря: '+reasons.slice(0,3).join(', ')+'.';tips=[];if(ls.avatar<7)tips.push('Улучши аватар');if(ls.username<7)tips.push('Сделай username чище');if(ls.bio<6)tips.push('Добавь описание профиля');if(ls.gifts<7)tips.push('Собери более редкие Gifts');if(!tips.length)tips.push('Продолжай в том же духе');screen='battle';haptic('medium');render();let n=0;const iv=setInterval(function(){n++;barVis=n;render();if(n>=7){clearInterval(iv);setTimeout(finishBattle,1100)}},850)}
  function finishBattle(){const isWin=winnerId===user.id;haptic(isWin?'success':'error');playSound(isWin?'win':'loss');applyPts(isWin);history.unshift({id:'b'+Date.now(),opponent:opponent.username,mode:mode,result:isWin?'WIN':'LOSS',ptsDelta:isWin?25:-25,date:new Date().toISOString().slice(0,10)});save();screen='result';render()}

  function canSendChat(){const now=Date.now();chatSentTimes=chatSentTimes.filter(t=>now-t<25*60*1000);return chatSentTimes.length<5}
  function remainingChat(){const now=Date.now();chatSentTimes=chatSentTimes.filter(t=>now-t<25*60*1000);return 5-chatSentTimes.length}
  function sendChat(text){text=(text||'').trim();if(!text||!canSendChat())return;chatSentTimes.push(Date.now());chatMessages.push({id:Date.now(),user:user.username,text:text,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});save();render()}

  function renderArenas(){return'<div class="screen fade"><div class="bb-wrap"><div class="bb-track" id="bbTrack">'+BB.map(b=>'<div class="bb" style="background:'+b.g+'"><div class="bb-title">'+b.title+'</div><div class="bb-sub">'+b.sub+'</div></div>').join('')+'</div><div class="dots">'+BB.map((_,i)=>'<div class="dot'+(i===bbIdx?' on':'')+'"></div>').join('')+'</div></div><div class="card" style="padding:14px 16px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px">'+avatarHTML(user.username,null,user.photoUrl)+'<div style="flex:1"><div style="font-weight:700;font-size:15px">@'+user.username+'</div><div style="display:flex;gap:8px;margin-top:4px;align-items:center"><span class="rank">'+user.rank+'</span><span class="muted">'+user.pts+' PTS</span></div></div>'+(user.winStreak>0?'<div style="text-align:center"><div style="font-size:16px">🔥</div><div style="font-weight:700;font-size:13px">'+user.winStreak+'</div></div>':'')+'</div></div><div class="card arena arena-larp"><div class="arena-title" style="color:#3dd6c6">LARP ARENA</div><div class="arena-desc">Битва коллекций Telegram Gifts. Редкость, дизайн, ценность и визуальная сила.</div><button class="btn btn-primary btn-block" onclick="App.startSearch(\'LARP\')">Начать подбор</button></div><div class="card arena arena-mog"><div class="arena-title" style="color:#4da3ff">MOG ARENA</div><div class="arena-desc">Полная оценка профиля: avatar, username, bio, gifts, age, Premium.</div><button class="btn btn-primary btn-block" onclick="App.startSearch(\'MOG\')">Начать подбор</button></div></div>'}
  function renderSearch(){const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');let extra='';if(opponent){extra='<div class="card" style="padding:16px;width:100%;text-align:center">'+avatarHTML(opponent.username)+'<div style="margin-top:8px;font-weight:700">@'+opponent.username+'</div><div class="muted">'+opponent.rank+' · '+opponent.pts+' PTS</div></div>'}else if(searchSec>=60){extra='<div class="muted" style="margin-bottom:12px">Соперник не найден</div><button class="btn btn-primary" onclick="App.startSearch(\''+mode+'\')">Попробовать ещё раз</button><button class="btn btn-ghost" style="margin-top:10px" onclick="App.go(\'arenas\')">Назад</button>'}else{extra='<button class="btn btn-danger" onclick="App.cancelSearch()">Отменить поиск</button>'}return'<div class="screen fade"><div class="search-wrap"><div class="ring"><div class="ring-orbit"></div>'+avatarHTML(user.username,'avatar-lg',user.photoUrl)+'</div><div class="h2 '+(opponent?'':'pulse')+'">'+(opponent?'Соперник найден!':'Поиск соперника...')+'</div><div class="muted" id="searchTimer">'+mode+' · '+mm+':'+ss+'</div>'+extra+'</div></div>'}
  function renderBattle(){return'<div class="screen fade"><div style="text-align:center;margin-bottom:8px"><div class="h2">'+mode+' BATTLE</div><div class="muted pulse">Анализ профилей...</div></div><div class="vs-row"><div class="vs-player">'+avatarHTML(user.username,null,user.photoUrl)+'<div style="font-weight:700;margin-top:6px;font-size:13px">@'+user.username+'</div><div class="rank" style="margin-top:4px">'+user.rank+'</div>'+(barVis>=7?'<div class="score-big">'+myOv.toFixed(2)+'</div>':'')+'</div><div class="vs-badge">VS</div><div class="vs-player">'+avatarHTML(opponent.username)+'<div style="font-weight:700;margin-top:6px;font-size:13px">@'+opponent.username+'</div><div class="rank" style="margin-top:4px">'+opponent.rank+'</div>'+(barVis>=7?'<div class="score-big">'+oppOv.toFixed(2)+'</div>':'')+'</div></div>'+(barVis>0?'<div class="card" style="padding:14px;margin-top:8px"><div class="muted" style="margin-bottom:6px;font-size:12px">Анализ...</div><div style="height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+(Math.min(100,barVis*14))+'%;background:linear-gradient(90deg,#3d8bfd,#3dd6c6);border-radius:2px;transition:width .4s"></div></div></div>':'')+'</div>'}
  function renderResult(){const win=winnerId===user.id;return'<div class="screen fade"><div style="padding:20px 12px;margin:12px 0"><div class="'+(win?'result-win':'result-loss')+'">'+(win?'🏆 WIN':'💀 LOSS')+'</div><div class="muted" style="margin-top:8px;text-align:center">'+(win?'+25':'-25')+' PTS → <b style="color:var(--text)">'+user.pts+' PTS</b></div><div style="margin-top:8px;text-align:center"><span class="rank'+(showRankUp?' rank-up':'')+'">'+user.rank+'</span>'+(user.winStreak>0?' <span style="margin-left:8px;font-size:14px">🔥 '+user.winStreak+'</span>':'')+'</div>'+(showRankUp?'<div class="muted" style="text-align:center;margin-top:6px;color:var(--cyan)">RANK UP!</div>':'')+'</div><div class="vs-row"><div class="vs-player"><div class="score-big">'+myOv.toFixed(2)+'</div><div class="muted">@'+user.username+'</div></div><div class="vs-badge">VS</div><div class="vs-player"><div class="score-big">'+oppOv.toFixed(2)+'</div><div class="muted">@'+opponent.username+'</div></div></div><div class="card" style="padding:14px;margin-bottom:12px"><div class="h2" style="margin-bottom:6px">Почему так?</div><div class="muted">'+commentary+'</div></div><div class="card" style="padding:14px;margin-bottom:16px"><div class="h2" style="margin-bottom:6px">Что улучшить</div>'+tips.map(t=>'<div class="muted" style="margin-bottom:4px">· '+t+'</div>').join('')+'</div><button class="btn btn-primary btn-block" onclick="App.go(\'arenas\')">На арену</button><button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="App.startSearch(\''+mode+'\')">Ещё битва</button></div>'}
  function renderLB(){const list=[...PLAYERS].map(p=>p.id===user.id?user:p).filter(p=>!(p.hideFromLB&&p.id===user.id)).sort((a,b)=>b.pts-a.pts);return'<div class="screen fade"><div class="h1" style="margin-bottom:16px">Leaderboard</div>'+list.map((p,i)=>'<div class="card lb-row" onclick="App.openPlayer('+p.id+')"><div class="lb-place'+(i<3?' top':'')+'">'+(i+1)+'</div>'+avatarHTML(p.username,'avatar-sm',p.photoUrl)+'<div style="flex:1"><div style="font-weight:600;font-size:14px">@'+p.username+'</div><div class="muted" style="font-size:12px">'+p.rank+'</div></div><div style="font-weight:700;font-size:14px">'+p.pts+'</div></div>').join('')+'</div>'}
  function renderProfile(){const nr=ptsToNext(user.pts);return'<div class="screen fade"><div class="profile-header"><div style="position:relative">'+avatarHTML(user.username,'avatar-lg',user.photoUrl)+'<div class="avatar-orbit"></div></div><div class="h1">@'+user.username+'</div><div class="energy-line"></div><span class="rank">'+user.rank+'</span><div class="muted">'+user.pts+' PTS'+(user.winStreak>0?' · 🔥 '+user.winStreak:'')+'</div>'+(nr.next?'<div class="muted" style="font-size:12px">До '+nr.next+': '+nr.need+' PTS</div>':'')+'</div><div class="stat-grid"><div class="card stat-box"><div class="stat-val">'+(user.overallScore||0).toFixed(2)+'</div><div class="stat-label">Overall</div></div><div class="card stat-box"><div class="stat-val">'+user.battlesPlayed+'</div><div class="stat-label">Battles</div></div><div class="card stat-box"><div class="stat-val">'+user.wins+'</div><div class="stat-label">Wins</div></div><div class="card stat-box"><div class="stat-val">'+user.losses+'</div><div class="stat-label">Losses</div></div></div><div class="card toggle" style="margin-bottom:14px" onclick="App.toggleHideLB()"><div><div style="font-weight:600;font-size:14px">Скрыть из Leaderboard</div><div class="muted" style="font-size:12px">Тебя не будет в TOP 100</div></div><div class="toggle-sw'+(user.hideFromLB?' on':'')+'"><div class="toggle-kn"></div></div></div><button class="btn btn-ghost btn-block" style="margin-bottom:14px" onclick="App.go(\'chat\')">Arena Chat</button><div class="h2" style="margin:6px 0 10px">История битв</div>'+history.slice(0,12).map(h=>'<div class="card hist"><div><div style="font-weight:600;font-size:14px">'+(h.result==='WIN'?'🏆':'💀')+' @'+h.opponent+'</div><div class="muted">'+h.mode+' · '+h.date+'</div></div><div style="font-weight:700;color:'+(h.result==='WIN'?'var(--win)':'var(--danger)')+'">'+(h.ptsDelta>0?'+':'')+h.ptsDelta+'</div></div>').join('')+'</div>'}
  function renderPlayer(){const p=viewPlayer;if(!p)return'';return'<div class="screen fade"><button class="btn btn-ghost" style="margin-bottom:14px" onclick="App.go(\'leaderboard\')">← Назад</button><div class="profile-header"><div style="position:relative">'+avatarHTML(p.username,'avatar-lg',p.photoUrl)+'<div class="avatar-orbit"></div></div><div class="h1">@'+p.username+'</div><div class="energy-line"></div><span class="rank">'+p.rank+'</span><div class="muted">'+p.pts+' PTS · 🔥 '+p.winStreak+'</div></div><div class="stat-grid"><div class="card stat-box"><div class="stat-val">'+(p.overallScore||0).toFixed(2)+'</div><div class="stat-label">Overall</div></div><div class="card stat-box"><div class="stat-val">'+p.battlesPlayed+'</div><div class="stat-label">Battles</div></div></div>'+(p.id!==user.id?'<button class="btn btn-primary btn-block" onclick="App.openChallenge('+p.id+')">⚔ Вызвать на битву</button>':'')+'</div>'}
  function renderChat(){const left=remainingChat();return'<div class="screen fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="h1">Arena Chat</div><button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" onclick="App.go(\'profile\')">← Назад</button></div><div class="muted" style="margin-bottom:12px">5 сообщений / 25 мин · Осталось: '+left+'</div><div style="margin-bottom:16px">'+chatMessages.slice(-30).map(m=>'<div class="chat-msg">'+avatarHTML(m.user,'avatar-sm')+'<div class="chat-bubble"><div class="chat-meta">@'+m.user+' · '+m.time+'</div>'+m.text+'</div></div>').join('')+'</div>'+(left>0?'<div class="chat-input-wrap"><input class="chat-input" id="chatInput" placeholder="Сообщение..." maxlength="200"/><button class="btn btn-primary" style="padding:12px 16px" onclick="App.sendChatMsg()">→</button></div>':'<div class="muted" style="text-align:center">Лимит сообщений достигнут. Попробуй позже.</div>')+'</div>'}
  function renderChallengeModal(){if(!showChallengeModal||!challengeTarget)return'';return'<div class="modal-bg" onclick="App.closeChallenge()"><div class="modal" onclick="event.stopPropagation()"><div class="h2" style="margin-bottom:12px">Вызов @'+challengeTarget.username+'</div><div class="muted" style="margin-bottom:16px">Выбери режим битвы</div><button class="btn btn-primary btn-block" style="margin-bottom:10px" onclick="App.doChallenge(\'LARP\')">LARP ARENA</button><button class="btn btn-primary btn-block" style="margin-bottom:10px" onclick="App.doChallenge(\'MOG\')">MOG ARENA</button><button class="btn btn-ghost btn-block" onclick="App.closeChallenge()">Отмена</button></div></div>'}

  function render(){
    const root=document.getElementById('app');
    let html='<div class="particles" id="particles"></div>';
    if(screen==='arenas')html+=renderArenas();
    else if(screen==='search')html+=renderSearch();
    else if(screen==='battle')html+=renderBattle();
    else if(screen==='result'){html+=renderResult();showRankUp=false}
    else if(screen==='leaderboard')html+=renderLB();
    else if(screen==='profile')html+=renderProfile();
    else if(screen==='player')html+=renderPlayer();
    else if(screen==='chat')html+=renderChat();

    if(showNav()){
      html+='<div class="nav-wrap"><nav class="nav"><div class="nav-pill" style="transform:translateX('+(navIndex*100)+'%)"></div>'+
        '<button class="nav-item'+(navIndex===0?' active':'')+'" onclick="App.go(\'arenas\')"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Арены</button>'+
        '<button class="nav-item'+(navIndex===1?' active':'')+'" onclick="App.go(\'leaderboard\')"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M4h10v5a5 5 0 01-10 0V4zM5 9H3v2a4 4 0 004 4M19 9h2v2a4 4 0 01-4 4"/></svg>Топ</button>'+
        '<button class="nav-item'+(navIndex===2?' active':'')+'" onclick="App.go(\'profile\')"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>Профиль</button></nav></div>';
    }
    html+=renderChallengeModal();
    root.innerHTML=html;

    // re-add particles
    const pc=document.getElementById('particles');
    if(pc&&!pc.children.length){for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(12+Math.random()*18)+'s';p.style.animationDelay=(Math.random()*12)+'s';p.style.width=p.style.height=(1.5+Math.random()*2)+'px';pc.appendChild(p)}}

    const track=document.getElementById('bbTrack');
    if(track){track.onscroll=function(){bbIdx=Math.round(track.scrollLeft/track.clientWidth);document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===bbIdx))}}
    const inp=document.getElementById('chatInput');
    if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')App.sendChatMsg()});
  }

  window.App={
    go:go,startSearch:startSearch,cancelSearch:cancelSearch,
    openPlayer:function(id){viewPlayer=PLAYERS.find(p=>p.id===id)||PLAYERS[0];if(viewPlayer.id===user.id)viewPlayer=user;go('player')},
    openChallenge:function(id){challengeTarget=PLAYERS.find(p=>p.id===id);if(challengeTarget){showChallengeModal=true;render()}},
    closeChallenge:function(){showChallengeModal=false;render()},
    doChallenge:function(m){showChallengeModal=false;if(challengeTarget){opponent=challengeTarget;startBattle(m,challengeTarget)}},
    toggleHideLB:function(){user.hideFromLB=!user.hideFromLB;save();haptic('light');render()},
    sendChatMsg:function(){const inp=document.getElementById('chatInput');if(inp){sendChat(inp.value);inp.value=''}}
  };
  render();
})();
</script>
</body>
</html>
