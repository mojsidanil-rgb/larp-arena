<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#070b12"/>
<title>Larp Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#070b12; --card:rgba(12,18,30,.88); --border:rgba(90,150,255,.24);
  --text:#edf2fa; --muted:#7d8fa8; --blue:#4da3ff; --blue2:#6bb8ff; --cyan:#3dd6c6;
  --gold:#f0c14b; --gold2:#e8a817; --glow:rgba(77,163,255,.35);
  --danger:#ff5c7a; --win:#3dd68c; --online:#3dd68c;
  --safe:env(safe-area-inset-bottom,0px); --nav-h:64px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);background:var(--bg);line-height:1.4;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(ellipse 100% 50% at 50% -20%,rgba(40,100,200,.12),transparent 55%),var(--bg)}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(120,180,255,.5);box-shadow:0 0 5px rgba(100,170,255,.35);animation:float linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.55}90%{opacity:.35}100%{transform:translateY(-8vh) scale(1);opacity:0}}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav-h)+var(--safe)+12px);-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.screen{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 4px 24px rgba(0,0,0,.38),0 0 0 .5px rgba(120,170,255,.07),inset 0 1px 0 rgba(255,255,255,.04)}

/* NAV */
.nav-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(10px + var(--safe));z-index:100;pointer-events:none}
.nav{pointer-events:auto;position:relative;display:flex;align-items:center;height:54px;padding:4px;border-radius:27px;max-width:280px;margin:0 auto;
  background:rgba(8,12,20,.85);border:1px solid rgba(130,170,230,.18);
  backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);
  box-shadow:0 8px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.nav-pill{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc(50% - 4px);border-radius:23px;
  background:rgba(14,20,34,.98);border:1px solid rgba(140,185,255,.3);
  box-shadow:0 2px 12px rgba(0,0,0,.45),0 0 16px rgba(70,140,255,.14),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .55s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none}
.nav-item{position:relative;z-index:1;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;cursor:pointer;color:rgba(150,170,200,.4);font-size:10px;font-weight:600;transition:color .28s}
.nav-item.active{color:#6bb8ff}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .28s,filter .28s}
.nav-item.active svg{filter:drop-shadow(0 0 7px rgba(90,170,255,.7));transform:scale(1.07)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-weight:600;font-size:15px;border:none;cursor:pointer;color:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#3d8bfd,#2a6adf);color:#fff;border:1px solid rgba(140,190,255,.3);box-shadow:0 4px 20px rgba(61,139,253,.38)}
.btn-ghost{background:rgba(60,130,220,.08);border:1px solid rgba(100,160,255,.25);color:var(--blue)}
.btn-danger{background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.28);color:var(--danger)}
.btn-block{width:100%}
.h1{font-size:22px;font-weight:700}.h2{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.rank{display:inline-flex;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(60,130,220,.12);color:var(--blue2);border:1px solid rgba(100,160,255,.3);box-shadow:0 0 12px rgba(70,150,255,.15)}
.rank-gold{background:rgba(240,193,75,.12);color:var(--gold);border-color:rgba(240,193,75,.35);box-shadow:0 0 12px rgba(240,193,75,.2)}

.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#15253f,#1e3558);
  border:1.5px solid rgba(110,170,255,.35);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:19px;color:var(--blue);flex-shrink:0;overflow:hidden;box-shadow:0 0 16px rgba(60,130,255,.16);position:relative}
.avatar-lg{width:88px;height:88px;font-size:32px;border-width:2px}
.avatar-sm{width:40px;height:40px;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{position:relative;display:inline-block}
.avatar-gold{border-color:rgba(240,193,75,.55)!important;box-shadow:0 0 22px rgba(240,193,75,.35)!important}
.online-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--bg);box-shadow:0 0 8px rgba(61,214,140,.6);z-index:2}
.avatar-orbit{position:absolute;inset:-7px;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(90,170,255,.7);border-right-color:rgba(70,200,190,.35);animation:spin 3.2s linear infinite;pointer-events:none}
.avatar-orbit-gold{border-top-color:rgba(240,193,75,.8);border-right-color:rgba(240,193,75,.35);filter:drop-shadow(0 0 4px rgba(240,193,75,.4))}
@keyframes spin{to{transform:rotate(360deg)}}
.crown{font-size:22px;line-height:1;margin-bottom:-4px;filter:drop-shadow(0 0 6px rgba(240,193,75,.5))}

.bb-wrap{margin-bottom:14px}
.bb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.bb-track::-webkit-scrollbar{display:none}
.bb{min-width:100%;scroll-snap-align:start;height:112px;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border);position:relative;overflow:hidden}
.bb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(77,163,255,.2),transparent 55%);pointer-events:none}
.bb-title{font-size:18px;font-weight:700;position:relative;z-index:1}
.bb-sub{font-size:12px;color:rgba(255,255,255,.62);position:relative;z-index:1;margin-top:2px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15)}.dot.on{background:var(--blue);box-shadow:0 0 7px var(--glow)}
.arena{padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.arena::before{content:'';position:absolute;top:-30%;right:-15%;width:130px;height:130px;border-radius:50%;opacity:.09;pointer-events:none}
.arena-larp::before{background:#3dd6c6}.arena-mog::before{background:#4da3ff}
.arena-title{font-size:18px;font-weight:800;letter-spacing:.03em;margin-bottom:5px}
.arena-desc{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.45}
.search-wrap{display:flex;flex-direction:column;align-items:center;padding-top:48px;gap:20px}
.ring{width:136px;height:136px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring-orbit{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--blue);border-right-color:var(--cyan);animation:spin 1.3s linear infinite;box-shadow:0 0 18px var(--glow)}
.pulse{animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.profile-header{display:flex;flex-direction:column;align-items:center;gap:9px;padding:24px 0 16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat-box{padding:13px;text-align:center}
.stat-val{font-size:19px;font-weight:700}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.energy-line{width:48px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(100,170,255,.5),transparent);margin-top:3px}
.hist{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px;margin-bottom:10px}
.toggle-sw{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.08);position:relative;transition:background .25s;cursor:pointer;border:1px solid rgba(120,160,220,.14)}
.toggle-sw.on{background:rgba(61,139,253,.4);border-color:rgba(100,160,255,.35)}
.toggle-kn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
.toggle-sw.on .toggle-kn{transform:translateX(18px)}
.online-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--online);font-weight:600}
.online-badge i{width:7px;height:7px;border-radius:50%;background:var(--online);box-shadow:0 0 6px rgba(61,214,140,.7);display:inline-block}
.rank-up{animation:rankPulse 1.15s ease}
@keyframes rankPulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ===== BATTLE RESULT (like screenshot) ===== */
.battle-title{text-align:center;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--gold);margin-bottom:12px}
.player-block{text-align:center;position:relative;padding:8px 0 12px}
.badge-host{display:inline-block;padding:3px 12px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.06em;
  background:rgba(240,193,75,.15);color:var(--gold);border:1px solid rgba(240,193,75,.3);margin:6px 0}
.badge-guest{display:inline-block;padding:3px 12px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.06em;
  background:rgba(120,140,160,.12);color:var(--muted);border:1px solid rgba(120,140,160,.2);margin:6px 0}
.player-name{font-size:18px;font-weight:700;margin-top:2px}
.player-handle{font-size:12px;color:var(--gold);margin-top:1px}
.player-handle.dim{color:var(--muted)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;max-width:320px;margin-left:auto;margin-right:auto}
.mini-stat{background:rgba(16,22,36,.9);border:1px solid rgba(100,150,220,.15);border-radius:12px;padding:10px 8px;text-align:center}
.mini-stat-val{font-size:18px;font-weight:800}
.mini-stat-val.gold{color:var(--gold)}
.mini-stat-label{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}

.bars{max-width:340px;margin:0 auto;padding:0 4px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.bar-label{width:88px;flex-shrink:0;color:var(--muted);text-align:right;font-size:11px;line-height:1.2}
.bar-label b{color:var(--text);font-weight:600;display:block;font-size:11px}
.bar-track{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-fill.gold{background:linear-gradient(90deg,#e8a817,#f0c14b);box-shadow:0 0 8px rgba(240,193,75,.35)}
.bar-fill.grey{background:linear-gradient(90deg,#3a4555,#5a6575)}
.bar-score{width:36px;text-align:right;font-weight:700;font-size:12px;color:var(--gold)}
.bar-score.dim{color:var(--muted)}

.vs-divider{display:flex;align-items:center;justify-content:center;margin:14px 0;position:relative}
.vs-divider::before,.vs-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.vs-text{padding:0 14px;font-size:20px;font-weight:900;color:rgba(255,255,255,.7);letter-spacing:.08em}

.mogged{position:relative}
.mogged-stamp{
  position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);
  font-size:42px;font-weight:900;color:transparent;
  -webkit-text-stroke:2px #ff2d55;
  letter-spacing:.06em;opacity:.85;pointer-events:none;z-index:5;
  text-shadow:0 0 20px rgba(255,45,85,.3);white-space:nowrap;
}
.gap-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;margin-top:8px;max-width:340px;margin-left:auto;margin-right:auto}
.gap-label{font-size:12px;color:var(--muted)}
.gap-val{font-size:16px;font-weight:800;color:var(--gold)}
.explain{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.4;max-width:320px;margin-left:auto;margin-right:auto;padding:0 8px}
</style>
</head>
<body>
<div id="app">
  <div class="particles" id="particles"></div>
  <div id="content"></div>
  <div class="nav-wrap" id="navWrap">
    <nav class="nav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item active" data-tab="0" id="navArenas">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Арены
      </button>
      <button class="nav-item" data-tab="1" id="navProfile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>Профиль
      </button>
    </nav>
  </div>
</div>
<script>
(function(){
  (function(){const c=document.getElementById('particles');if(!c)return;for(let i=0;i<12;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(11+Math.random()*16)+'s';p.style.animationDelay=(Math.random()*10)+'s';p.style.width=p.style.height=(1.5+Math.random()*1.8)+'px';c.appendChild(p)}})();

  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();if(tg.expand)tg.expand();try{if(tg.setHeaderColor)tg.setHeaderColor('#070b12');if(tg.setBackgroundColor)tg.setBackgroundColor('#070b12')}catch(e){}}

  function haptic(t){try{const hf=tg&&tg.HapticFeedback;if(!hf)return;if(t==='success'||t==='error'||t==='warning')hf.notificationOccurred(t);else hf.impactOccurred(t==='medium'?'medium':t==='heavy'?'heavy':'light')}catch(e){}}

  let audioCtx=null;
  function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
  function tone(freq,start,dur,type,vol){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,audioCtx.currentTime+start);
    g.gain.setValueAtTime(0,audioCtx.currentTime+start);
    g.gain.linearRampToValueAtTime(vol||.12,audioCtx.currentTime+start+.02);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+start+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+dur+.05);
  }
  // WIN: "ту-ду!" ascending happy
  function playWin(){
    try{ensureAudio();
      tone(523,.0,.12,'square',.14);
      tone(659,.11,.12,'square',.13);
      tone(784,.22,.18,'square',.14);
      tone(1046,.38,.28,'triangle',.1);
    }catch(e){}}
  // LOSS: "ту-ту-ту-ту" descending sad
  function playLoss(){
    try{ensureAudio();
      tone(392,.0,.1,'square',.1);
      tone(349,.12,.1,'square',.09);
      tone(311,.24,.1,'square',.08);
      tone(262,.36,.22,'triangle',.07);
    }catch(e){}}

  function getRank(pts){if(pts>=2000)return'TRUE ADAM';if(pts>=1000)return'CHAD';if(pts>=500)return'HTN';if(pts>=150)return'LTN';return'SAB'}
  function ptsToNext(pts){const m=[50,150,500,1000,2000],n=['SAB','LTN','HTN','CHAD','TRUE ADAM'];if(pts<50)return{next:'SAB',need:50-pts};for(let i=0;i<m.length-1;i++)if(pts>=m[i]&&pts<m[i+1])return{next:n[i+1],need:m[i+1]-pts};return{next:null,need:0}}
  function makeScores(seed){const r=n=>Math.round((3.2+((seed*n*17)%65)/10)*100)/100;return{avatar:r(1),username:r(2),bio:r(3),gifts:r(4),giftValue:r(5),accountAge:r(6),telegramLevel:r(7)}}
  function overall(s){const v=[s.avatar,s.username,s.bio,s.gifts,s.giftValue,s.accountAge,s.telegramLevel];return Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100}

  const RAW=[
    {id:1,username:'raizen',pts:2450,winStreak:17,wins:42,losses:8,battlesPlayed:50,giftsCount:9,giftsValueUsd:2700,accountYear:2014,telegramLevel:10,unameMeta:'6 букв · слово'},
    {id:2,username:'Mr_mkfr',pts:380,winStreak:0,wins:5,losses:12,battlesPlayed:17,giftsCount:21,giftsValueUsd:380,accountYear:2022,telegramLevel:4,unameMeta:'7 букв'},
    {id:3,username:'neon',pts:1120,winStreak:5,wins:28,losses:11,battlesPlayed:39,giftsCount:9,giftsValueUsd:890,accountYear:2018,telegramLevel:8,unameMeta:'4 буквы'},
    {id:4,username:'voidx',pts:620,winStreak:2,wins:15,losses:9,battlesPlayed:24,giftsCount:6,giftsValueUsd:420,accountYear:2019,telegramLevel:6,unameMeta:'5 букв'},
    {id:5,username:'chadgod',pts:1580,winStreak:9,wins:35,losses:6,battlesPlayed:41,giftsCount:20,giftsValueUsd:4500,accountYear:2015,telegramLevel:12,unameMeta:'7 букв'},
    {id:6,username:'lumen',pts:2100,winStreak:12,wins:48,losses:7,battlesPlayed:55,giftsCount:18,giftsValueUsd:8900,accountYear:2013,telegramLevel:11,unameMeta:'5 букв'},
  ];
  const PLAYERS=RAW.map((p,i)=>{let scores=makeScores(p.id*13+i);if(p.pts>=2000)scores={avatar:6.62,username:9.48,bio:5.0,gifts:8.71,giftValue:7.96,accountAge:9.0,telegramLevel:4.05};if(p.username==='Mr_mkfr')scores={avatar:2.88,username:4.62,bio:5.0,gifts:3.84,giftValue:4.31,accountAge:2.10,telegramLevel:1.68};return{...p,rank:getRank(p.pts),scores,overallScore:overall(scores),online:Math.random()>0.35}});

  const BB=[
    {title:'New Season',sub:'x2.5 PTS Weekend',g:'linear-gradient(135deg,#1a3a5c,#0d1b2a 50%,#1b4d6e)'},
    {title:'MOG Arena',sub:'Full profile battles',g:'linear-gradient(135deg,#2a1a4a,#0d1b2a 50%,#3d2a6b)'},
    {title:'LARP Arena',sub:'Gifts collection wars',g:'linear-gradient(135deg,#1a4a3a,#0d1b2a 50%,#1b6e4d)'},
  ];

  let user=null;
  try{const r=localStorage.getItem('larp_user');if(r)user=JSON.parse(r)}catch(e){}
  if(!user){
    const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(tgUser){user={id:tgUser.id,username:tgUser.username||(tgUser.first_name||'player').toLowerCase(),firstName:tgUser.first_name||'',photoUrl:tgUser.photo_url||null,isPremium:!!tgUser.is_premium,pts:50,winStreak:0,wins:0,losses:0,battlesPlayed:0,hideFromLB:false,scores:makeScores(tgUser.id||1),giftsCount:0,giftsValueUsd:0,accountYear:2024,telegramLevel:1,unameMeta:'',online:true};user.rank=getRank(user.pts);user.overallScore=overall(user.scores)}
    else{const base=PLAYERS[0];user={...base,id:0,photoUrl:null,hideFromLB:false,online:true}}
  }
  user.rank=getRank(user.pts);user.online=true;
  if(!user.scores)user.scores=makeScores(1);
  if(!user.overallScore)user.overallScore=overall(user.scores);

  let history=[];try{const r=localStorage.getItem('larp_hist');if(r)history=JSON.parse(r)}catch(e){}
  if(!history.length)history=[{id:'h1',opponent:'Mr_mkfr',mode:'MOG',result:'WIN',ptsDelta:25,date:'2026-08-07'},{id:'h2',opponent:'neon',mode:'LARP',result:'WIN',ptsDelta:25,date:'2026-08-06'},{id:'h3',opponent:'chadgod',mode:'MOG',result:'LOSS',ptsDelta:-25,date:'2026-08-05'}];
  function save(){try{localStorage.setItem('larp_user',JSON.stringify(user));localStorage.setItem('larp_hist',JSON.stringify(history.slice(0,40)))}catch(e){}}

  let screen='arenas',mode='MOG',opponent=null,searchSec=0,searchIv=null;
  let barVis=0,myScores=null,oppScores=null,myOv=0,oppOv=0,winnerId=null;
  let commentary='',tips=[],bbIdx=0,navIndex=0,showRankUp=false;

  function avatarHTML(name,cls,photoUrl,showOnline,gold){
    const letter=(name||'?')[0].toUpperCase();
    let inner=photoUrl?'<img src="'+photoUrl+'" alt=""/>':letter;
    let extra=gold?' avatar-gold':'';
    let html='<div class="avatar-wrap"><div class="avatar '+(cls||'')+extra+'">'+inner+'</div>';
    if(showOnline)html+='<div class="online-dot"></div>';
    html+='</div>';return html;
  }

  function jitter(b){return Math.round(Math.min(10,Math.max(1,b+(Math.random()-.5)*.55))*100)/100}
  function computeScores(p,m){const s={...p.scores};if(m==='LARP'){s.gifts=jitter(s.gifts+.15);s.giftValue=jitter(s.giftValue+.2)}else{s.avatar=jitter(s.avatar);s.username=jitter(s.username)}return s}
  function overallMode(s,m){if(m==='LARP')return Math.round(Math.min(10,s.gifts*.26+s.giftValue*.24+s.avatar*.1+s.username*.1+s.bio*.06+s.accountAge*.12+s.telegramLevel*.12)*100)/100;return overall(s)}
  function findOpp(){const o=PLAYERS.filter(p=>p.id!==user.id).sort((a,b)=>Math.abs(a.pts-user.pts)-Math.abs(b.pts-user.pts));return o.slice(0,4)[Math.floor(Math.random()*Math.min(4,o.length))]||o[0]}
  function applyPts(isWin){const prev=user.rank;user.pts=Math.max(0,user.pts+(isWin?25:-25));user.rank=getRank(user.pts);if(isWin){user.wins++;user.winStreak++}else{user.losses++;user.winStreak=0}user.battlesPlayed++;if(prev!==user.rank&&isWin)showRankUp=true;save()}

  function setNav(idx){navIndex=idx;const pill=document.getElementById('navPill');if(pill)pill.style.transform='translateX('+(idx*100)+'%)';document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active',i===idx))}
  function showNav(show){const w=document.getElementById('navWrap');if(w)w.style.display=show?'block':'none'}

  function go(s){haptic('light');screen=s;if(s==='arenas'){setNav(0);showNav(true)}else if(s==='profile'){setNav(1);showNav(true)}else showNav(false);renderContent()}

  function startSearch(m){
    haptic('medium'); // vibration on start
    mode=m;opponent=null;searchSec=0;screen='search';showNav(false);renderContent();
    if(searchIv)clearInterval(searchIv);
    const t0=Date.now();
    searchIv=setInterval(function(){
      searchSec=Math.floor((Date.now()-t0)/1000);
      if(searchSec>=2+Math.floor(Math.random()*2)&&!opponent){clearInterval(searchIv);opponent=findOpp();haptic('success');renderContent();setTimeout(function(){startBattle(mode,opponent)},900)}
      else if(searchSec>=60&&!opponent){clearInterval(searchIv);renderContent()}
      else if(!opponent){const el=document.getElementById('searchTimer');if(el){const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');el.textContent=mode+' · '+mm+':'+ss}}
    },400);
  }
  function cancelSearch(){if(searchIv)clearInterval(searchIv);haptic('warning');go('arenas')} // vibration on cancel

  function startBattle(m,opp){
    opponent=opp;barVis=0;
    myScores=computeScores(user,m);oppScores=computeScores(opp,m);
    myOv=overallMode(myScores,m);oppOv=overallMode(oppScores,m);
    winnerId=myOv>=oppOv?user.id:opp.id;
    const reasons=[];const ws=winnerId===user.id?myScores:oppScores;const ls=winnerId===user.id?oppScores:myScores;
    if(ws.username>ls.username+.3)reasons.push('юзернейм');
    if(ws.gifts>ls.gifts+.3)reasons.push('коллекция подарков');
    if(ws.giftValue>ls.giftValue+.3)reasons.push('стоимость gifts');
    if(ws.avatar>ls.avatar+.3)reasons.push('аватар');
    if(ws.accountAge>ls.accountAge+.3)reasons.push('возраст аккаунта');
    if(!reasons.length)reasons.push('общий баланс профиля');
    commentary=(winnerId===user.id?'Мемная аватарка душит юзернейм, а витрина подарков пока просто фон':'Противник сильнее по ключевым параметрам профиля');
    tips=[];if(ls.avatar<7)tips.push('Улучши аватар');if(ls.username<7)tips.push('Сделай username чище');if(ls.gifts<7)tips.push('Собери более редкие Gifts');if(!tips.length)tips.push('Продолжай в том же духе');
    screen='battle';showNav(false);haptic('medium');renderContent();
    let n=0;const iv=setInterval(function(){n++;barVis=n;renderContent();if(n>=8){clearInterval(iv);setTimeout(finishBattle,700)}},700);
  }
  function finishBattle(){
    const isWin=winnerId===user.id;
    haptic(isWin?'success':'error');
    if(isWin)playWin();else playLoss();
    applyPts(isWin);
    history.unshift({id:'b'+Date.now(),opponent:opponent.username,mode:mode,result:isWin?'WIN':'LOSS',ptsDelta:isWin?25:-25,date:new Date().toISOString().slice(0,10)});
    save();screen='result';showNav(false);renderContent();
  }

  function barRows(scores,gold){
    const labels=[
      {k:'avatar',l:'Аватар',sub:''},
      {k:'username',l:'@username',sub:''},
      {k:'bio',l:'О себе',sub:''},
      {k:'gifts',l:'Подарки',sub:''},
      {k:'giftValue',l:'Стоимость',sub:''},
      {k:'accountAge',l:'Дата рег.',sub:''},
      {k:'telegramLevel',l:'Уровень TG',sub:''},
    ];
    // enrich sub from player if available later
    return labels.map(function(item){
      const v=scores[item.k]||0;
      const pct=Math.min(100,v*10);
      return '<div class="bar-row"><div class="bar-label"><b>'+item.l+'</b></div>'+
        '<div class="bar-track"><div class="bar-fill '+(gold?'gold':'grey')+'" style="width:'+(barVis>=8||screen==='result'?pct:0)+'%"></div></div>'+
        '<div class="bar-score'+(gold?'':' dim')+'">'+v.toFixed(2)+'</div></div>';
    }).join('');
  }

  function renderArenas(){
    return '<div class="screen"><div class="bb-wrap"><div class="bb-track" id="bbTrack">'+
      BB.map(b=>'<div class="bb" style="background:'+b.g+'"><div class="bb-title">'+b.title+'</div><div class="bb-sub">'+b.sub+'</div></div>').join('')+
      '</div><div class="dots">'+BB.map((_,i)=>'<div class="dot'+(i===bbIdx?' on':'')+'"></div>').join('')+'</div></div>'+
      '<div class="card" style="padding:13px 14px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:11px">'+
      avatarHTML(user.username,null,user.photoUrl,true)+
      '<div style="flex:1"><div style="font-weight:700;font-size:14px">@'+user.username+'</div>'+
      '<div style="display:flex;gap:7px;margin-top:3px;align-items:center"><span class="rank">'+user.rank+'</span><span class="muted">'+user.pts+' PTS</span></div>'+
      '<div class="online-badge" style="margin-top:3px"><i></i> онлайн</div></div>'+
      (user.winStreak>0?'<div style="text-align:center"><div style="font-size:15px">🔥</div><div style="font-weight:700;font-size:12px">'+user.winStreak+'</div></div>':'')+
      '</div></div>'+
      '<div class="card arena arena-larp"><div class="arena-title" style="color:#3dd6c6">LARP ARENA</div>'+
      '<div class="arena-desc">Битва коллекций Telegram Gifts. Редкость, дизайн, ценность.</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'LARP\')">Начать подбор</button></div>'+
      '<div class="card arena arena-mog"><div class="arena-title" style="color:#4da3ff">MOG ARENA</div>'+
      '<div class="arena-desc">Полная оценка профиля: avatar, username, bio, gifts, age.</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'MOG\')">Начать подбор</button></div></div>';
  }

  function renderSearch(){
    const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');
    let extra='';
    if(opponent){extra='<div class="card" style="padding:14px;width:100%;text-align:center">'+avatarHTML(opponent.username,null,null,opponent.online)+'<div style="margin-top:7px;font-weight:700">@'+opponent.username+'</div><div class="muted">'+opponent.rank+' · '+opponent.pts+' PTS</div>'+(opponent.online?'<div class="online-badge" style="justify-content:center;margin-top:4px"><i></i> онлайн</div>':'')+'</div>'}
    else if(searchSec>=60){extra='<div class="muted" style="margin-bottom:10px">Соперник не найден</div><button class="btn btn-primary" onclick="App.startSearch(\''+mode+'\')">Попробовать ещё раз</button><button class="btn btn-ghost" style="margin-top:8px" onclick="App.go(\'arenas\')">Назад</button>'}
    else{extra='<button class="btn btn-danger" onclick="App.cancelSearch()">Отменить поиск</button>'}
    return '<div class="screen"><div class="search-wrap"><div class="ring"><div class="ring-orbit"></div>'+avatarHTML(user.username,'avatar-lg',user.photoUrl,true)+'</div>'+
      '<div class="h2 '+(opponent?'':'pulse')+'">'+(opponent?'Соперник найден!':'Поиск соперника...')+'</div>'+
      '<div class="muted" id="searchTimer">'+mode+' · '+mm+':'+ss+'</div>'+extra+'</div></div>';
  }

  function renderBattle(){
    // during battle show simplified VS with progress
    return '<div class="screen"><div class="battle-title">'+mode+' BATTLE</div>'+
      '<div class="player-block">'+avatarHTML(user.username,'avatar-lg',user.photoUrl,true)+
      '<div class="player-name">@'+user.username+'</div><div class="muted" style="font-size:12px">'+user.rank+'</div></div>'+
      '<div class="vs-divider"><span class="vs-text">VS</span></div>'+
      '<div class="player-block">'+avatarHTML(opponent.username,'avatar-lg',null,opponent.online)+
      '<div class="player-name">@'+opponent.username+'</div><div class="muted" style="font-size:12px">'+opponent.rank+'</div></div>'+
      '<div class="card" style="padding:12px;margin-top:8px"><div class="muted" style="margin-bottom:5px;font-size:11px;text-align:center">Анализ профилей...</div>'+
      '<div style="height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden">'+
      '<div style="height:100%;width:'+(Math.min(100,barVis*12.5))+'%;background:linear-gradient(90deg,#3d8bfd,#3dd6c6);border-radius:2px;transition:width .35s"></div></div></div></div>';
  }

  function renderResult(){
    const iWin=winnerId===user.id;
    const host=iWin?{p:user,s:myScores,ov:myOv}:{p:opponent,s:oppScores,ov:oppOv};
    const guest=iWin?{p:opponent,s:oppScores,ov:oppOv}:{p:user,s:myScores,ov:myOv};
    // always show winner on top as HOST style
    const winP=host.p, winS=host.s, winOv=host.ov;
    const loseP=guest.p, loseS=guest.s, loseOv=guest.ov;
    const gap=Math.abs(winOv-loseOv).toFixed(2);
    const isMeWin=iWin;

    return '<div class="screen">'+
      '<div class="battle-title">'+mode+' BATTLE</div>'+
      // WINNER
      '<div class="player-block">'+
        '<div class="crown">👑</div>'+
        '<div style="position:relative;display:inline-block">'+avatarHTML(winP.username,'avatar-lg',winP.photoUrl,winP.online,true)+
          '<div class="avatar-orbit avatar-orbit-gold"></div></div>'+
        '<div class="badge-host">HOST PROFILE</div>'+
        '<div class="player-name">'+winP.username+'</div>'+
        '<div class="player-handle">@'+winP.username+'</div>'+
        '<div class="mini-stats">'+
          '<div class="mini-stat"><div class="mini-stat-val gold">'+winOv.toFixed(2)+'</div><div class="mini-stat-label">Overall Score</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val gold" style="font-size:13px">'+winP.rank+'</div><div class="mini-stat-label">Rank</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+winP.battlesPlayed+'</div><div class="mini-stat-label">Battles Played</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+winP.winStreak+'</div><div class="mini-stat-label">Win Streak</div></div>'+
        '</div>'+
        '<div class="bars">'+barRows(winS,true)+'</div>'+
      '</div>'+
      // VS
      '<div class="vs-divider"><span class="vs-text">VS</span></div>'+
      // LOSER + MOGGED
      '<div class="player-block mogged">'+
        '<div class="mogged-stamp">MOGGED</div>'+
        avatarHTML(loseP.username,'avatar-lg',loseP.photoUrl,loseP.online,false)+
        '<div class="badge-guest">GUEST PROFILE</div>'+
        '<div class="player-name">@'+loseP.username+'</div>'+
        '<div class="player-handle dim">@'+loseP.username+'</div>'+
        '<div class="mini-stats">'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseOv.toFixed(2)+'</div><div class="mini-stat-label">Overall Score</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val" style="font-size:13px">'+loseP.rank+'</div><div class="mini-stat-label">Rank</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseP.battlesPlayed+'</div><div class="mini-stat-label">Battles Played</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseP.winStreak+'</div><div class="mini-stat-label">Win Streak</div></div>'+
        '</div>'+
        '<div class="bars">'+barRows(loseS,false)+'</div>'+
      '</div>'+
      // gap + explain
      '<div class="gap-row"><span class="gap-label">Разрыв</span><span class="gap-val">'+gap+'</span></div>'+
      '<div class="explain">'+commentary+'</div>'+
      // pts change for me
      '<div style="text-align:center;margin:14px 0 8px">'+
        '<div style="font-size:15px;font-weight:700;color:'+(isMeWin?'var(--win)':'var(--danger)')+'">'+(isMeWin?'+25':'-25')+' PTS → '+user.pts+'</div>'+
        (showRankUp?'<div class="muted" style="color:var(--cyan);margin-top:4px">RANK UP! '+user.rank+'</div>':'')+
      '</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.go(\'arenas\')">На арену</button>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="App.startSearch(\''+mode+'\')">Ещё битва</button>'+
    '</div>';
  }

  function renderProfile(){
    const nr=ptsToNext(user.pts);
    return '<div class="screen"><div class="profile-header">'+
      '<div style="position:relative">'+avatarHTML(user.username,'avatar-lg',user.photoUrl,true)+'<div class="avatar-orbit"></div></div>'+
      '<div class="h1">@'+user.username+'</div><div class="energy-line"></div>'+
      '<span class="rank">'+user.rank+'</span>'+
      '<div class="muted">'+user.pts+' PTS'+(user.winStreak>0?' · 🔥 '+user.winStreak:'')+'</div>'+
      '<div class="online-badge"><i></i> онлайн</div>'+
      (nr.next?'<div class="muted" style="font-size:12px">До '+nr.next+': '+nr.need+' PTS</div>':'')+
      '</div>'+
      '<div class="stat-grid">'+
        '<div class="card stat-box"><div class="stat-val">'+(user.overallScore||0).toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.battlesPlayed+'</div><div class="stat-label">Battles</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.wins+'</div><div class="stat-label">Wins</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.losses+'</div><div class="stat-label">Losses</div></div></div>'+
      '<div class="card toggle" style="margin-bottom:12px" onclick="App.toggleHideLB()">'+
        '<div><div style="font-weight:600;font-size:13px">Скрыть из Leaderboard</div><div class="muted" style="font-size:11px">Когда появится Топ</div></div>'+
        '<div class="toggle-sw'+(user.hideFromLB?' on':'')+'"><div class="toggle-kn"></div></div></div>'+
      '<div class="h2" style="margin:4px 0 8px">История битв</div>'+
      history.slice(0,10).map(h=>'<div class="card hist"><div><div style="font-weight:600;font-size:13px">'+(h.result==='WIN'?'🏆':'💀')+' @'+h.opponent+'</div><div class="muted">'+h.mode+' · '+h.date+'</div></div><div style="font-weight:700;color:'+(h.result==='WIN'?'var(--win)':'var(--danger)')+'">'+(h.ptsDelta>0?'+':'')+h.ptsDelta+'</div></div>').join('')+
    '</div>';
  }

  function renderContent(){
    const box=document.getElementById('content');if(!box)return;
    let html='';
    if(screen==='arenas')html=renderArenas();
    else if(screen==='search')html=renderSearch();
    else if(screen==='battle')html=renderBattle();
    else if(screen==='result'){html=renderResult();showRankUp=false}
    else if(screen==='profile')html=renderProfile();
    box.innerHTML=html;
    const track=document.getElementById('bbTrack');
    if(track){track.onscroll=function(){bbIdx=Math.round(track.scrollLeft/track.clientWidth);document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===bbIdx))}}
  }

  document.getElementById('navArenas').onclick=function(){go('arenas')};
  document.getElementById('navProfile').onclick=function(){go('profile')};

  window.App={
    go:go,startSearch:startSearch,cancelSearch:cancelSearch,
    toggleHideLB:function(){user.hideFromLB=!user.hideFromLB;save();haptic('light');renderContent()}
  };
  setNav(0);renderContent();
})();
</script>
</body>
</html>
