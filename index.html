<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<title>Larp Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#0b1220;
  --card:rgba(22,32,52,.82);
  --border:rgba(130,180,255,.34);
  --text:#eef3fb;
  --muted:#8b9bb3;
  --blue:#5aadff;
  --blue2:#7ec0ff;
  --cyan:#3dd6c6;
  --gold:#f0c14b;
  --danger:#ff5c7a;
  --win:#3dd68c;
  --safe:env(safe-area-inset-bottom,0px);
  --nav-h:56px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);background:var(--bg);line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(ellipse 90% 45% at 50% -8%,rgba(60,130,220,.18),transparent 55%),
    radial-gradient(ellipse 50% 35% at 90% 70%,rgba(50,100,180,.08),transparent),
    var(--bg)}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(140,190,255,.45);box-shadow:0 0 6px rgba(120,180,255,.35);animation:float linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}15%{opacity:.5}85%{opacity:.3}100%{transform:translateY(-8vh) scale(1);opacity:0}}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px calc(var(--nav-h)+var(--safe)+10px);-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.screen{animation:fadeIn .22s ease}
.screen.no-fade{animation:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:14px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 4px 20px rgba(0,0,0,.28),0 0 18px rgba(70,140,255,.1),inset 0 1px 0 rgba(255,255,255,.06);
}

/* NAV compact */
.nav-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(8px + var(--safe));z-index:100;pointer-events:none}
.nav{pointer-events:auto;position:relative;display:flex;align-items:center;height:48px;padding:4px;border-radius:24px;max-width:280px;margin:0 auto;
  background:rgba(18,22,32,.75);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);
  box-shadow:0 8px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.nav-pill{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc(50% - 4px);border-radius:20px;
  background:rgba(40,48,64,.95);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .55s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none}
.nav-item{position:relative;z-index:1;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;cursor:pointer;color:rgba(160,170,185,.45);font-size:9px;font-weight:600;transition:color .28s}
.nav-item.active{color:rgba(240,245,255,.95)}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .28s,filter .28s}
.nav-item.active svg{filter:none;transform:scale(1.05)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;font-weight:600;font-size:13px;border:none;cursor:pointer;color:inherit;transition:transform .14s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#4d95ff,#2f6fe0);color:#fff;border:1.5px solid rgba(160,200,255,.42);box-shadow:0 4px 16px rgba(61,139,253,.35),0 0 12px rgba(80,150,255,.12)}
.btn-ghost{background:rgba(70,140,230,.1);border:1.5px solid rgba(130,180,255,.38);color:var(--blue);box-shadow:0 0 10px rgba(70,140,255,.08)}
.btn-danger{background:rgba(255,92,122,.1);border:1.5px solid rgba(255,92,122,.38);color:var(--danger)}
.btn-block{width:100%}
.h1{font-size:17px;font-weight:700}.h2{font-size:13px;font-weight:600}
.muted{color:var(--muted);font-size:11px}
.rank{display:inline-flex;padding:3px 9px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:.03em;
  background:rgba(70,140,230,.14);color:var(--blue2);border:1.5px solid rgba(130,180,255,.38);box-shadow:0 0 10px rgba(80,150,255,.12)}

.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#1a2d4a,#243f66);
  border:1.5px solid rgba(140,185,255,.45);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:var(--blue);flex-shrink:0;overflow:hidden;
  box-shadow:0 0 12px rgba(80,150,255,.18);position:relative}
.avatar-lg{width:72px;height:72px;font-size:26px;border-width:2.5px;border-color:rgba(80,160,255,.65);box-shadow:0 0 0 3px rgba(40,100,200,.2),0 0 20px rgba(70,140,255,.25)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{position:relative;display:inline-block}
.avatar-gold{border-color:rgba(240,193,75,.55)!important;box-shadow:0 0 18px rgba(240,193,75,.3)!important}
.avatar-orbit{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(110,180,255,.7);border-right-color:rgba(70,200,190,.3);animation:spin 3.2s linear infinite;pointer-events:none}
.avatar-orbit-gold{border-top-color:rgba(240,193,75,.8);border-right-color:rgba(240,193,75,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.crown{font-size:16px;line-height:1;margin-bottom:-2px;filter:drop-shadow(0 0 5px rgba(240,193,75,.5))}

/* billboard */
.bb-wrap{margin-bottom:10px}
.bb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none}
.bb-track::-webkit-scrollbar{display:none}
.bb{min-width:100%;scroll-snap-align:start;height:88px;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1.5px solid var(--border);position:relative;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.25),0 0 16px rgba(70,140,255,.1)}
.bb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(100,170,255,.22),transparent 55%);pointer-events:none}
.bb-title{font-size:15px;font-weight:700;position:relative;z-index:1}
.bb-sub{font-size:11px;color:rgba(255,255,255,.62);position:relative;z-index:1;margin-top:1px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:7px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15)}.dot.on{background:var(--blue);box-shadow:0 0 6px rgba(90,170,255,.5)}

/* arena grid like reference */
.arena-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.arena{padding:12px;position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.arena::before{content:'';position:absolute;top:-25%;right:-15%;width:100px;height:100px;border-radius:50%;opacity:.12;pointer-events:none}
.arena-larp{background:linear-gradient(160deg,rgba(20,50,45,.9),rgba(14,24,40,.9));border-color:rgba(61,214,198,.35)}
.arena-larp::before{background:#3dd6c6}
.arena-mog{background:linear-gradient(160deg,rgba(25,40,70,.9),rgba(14,24,40,.9));border-color:rgba(90,170,255,.4)}
.arena-mog::before{background:#5aadff}
.arena-title{font-size:14px;font-weight:800;letter-spacing:.02em;margin-bottom:3px;position:relative;z-index:1}
.arena-desc{font-size:10.5px;color:var(--muted);margin-bottom:10px;line-height:1.35;position:relative;z-index:1}

/* user strip */
.user-strip{padding:10px 12px;margin-bottom:10px}
.user-strip .row{display:flex;align-items:center;gap:10px}

/* search */
.search-wrap{display:flex;flex-direction:column;align-items:center;padding-top:32px;gap:12px}
.ring{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring-orbit{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--blue);border-right-color:var(--cyan);animation:spin 1.3s linear infinite;box-shadow:0 0 14px rgba(90,170,255,.35)}
.pulse{animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* profile compact */
.profile-header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat-box{padding:12px 8px;text-align:center;border-radius:14px}
.stat-val{font-size:18px;font-weight:700}.stat-label{font-size:10px;color:var(--muted);margin-top:1px}
.energy-line{width:40px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(120,180,255,.5),transparent);margin-top:2px}
.hist{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;margin-bottom:7px;border-radius:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:10px;border-radius:14px}
.toggle-sw{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.08);position:relative;transition:background .25s;cursor:pointer;border:1.5px solid rgba(130,170,220,.25)}
.toggle-sw.on{background:rgba(70,140,230,.4);border-color:rgba(130,180,255,.4)}
.toggle-kn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.toggle-sw.on .toggle-kn{transform:translateX(16px)}
.rank-up{animation:rankPulse 1.1s ease}
@keyframes rankPulse{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}

/* battle result */
.battle-title{text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold);margin-bottom:8px}
.player-block{text-align:center;position:relative;padding:4px 0 8px}
.badge-host{display:inline-block;padding:2px 9px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.05em;background:rgba(240,193,75,.14);color:var(--gold);border:1px solid rgba(240,193,75,.3);margin:4px 0}
.badge-guest{display:inline-block;padding:2px 9px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.05em;background:rgba(120,140,160,.12);color:var(--muted);border:1px solid rgba(120,140,160,.22);margin:4px 0}
.player-name{font-size:14px;font-weight:700;margin-top:1px}
.player-handle{font-size:11px;color:var(--gold);margin-top:0}
.player-handle.dim{color:var(--muted)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;max-width:300px;margin-left:auto;margin-right:auto}
.mini-stat{background:rgba(18,26,42,.9);border:1.5px solid rgba(130,180,255,.28);border-radius:10px;padding:7px 5px;text-align:center;box-shadow:0 0 10px rgba(70,140,255,.06)}
.mini-stat-val{font-size:14px;font-weight:800}
.mini-stat-val.gold{color:var(--gold)}
.mini-stat-label{font-size:9px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.03em}
.bars{max-width:320px;margin:0 auto;padding:0 2px}
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px}
.bar-label{width:70px;flex-shrink:0;color:var(--muted);text-align:right;font-size:10px}
.bar-label b{color:var(--text);font-weight:600;display:block;font-size:10px}
.bar-track{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.gold{background:linear-gradient(90deg,#e8a817,#f0c14b);box-shadow:0 0 6px rgba(240,193,75,.3)}
.bar-fill.grey{background:linear-gradient(90deg,#3a4555,#5a6575)}
.bar-score{width:32px;text-align:right;font-weight:700;font-size:11px;color:var(--gold)}
.bar-score.dim{color:var(--muted)}
.vs-divider{display:flex;align-items:center;justify-content:center;margin:8px 0}
.vs-divider::before,.vs-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.vs-text{padding:0 10px;font-size:16px;font-weight:900;color:rgba(255,255,255,.65);letter-spacing:.06em}
.mogged{position:relative}
.mogged-stamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:30px;font-weight:900;color:transparent;-webkit-text-stroke:1.5px #ff2d55;letter-spacing:.05em;opacity:.85;pointer-events:none;z-index:5;white-space:nowrap}
.gap-row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-top:4px;max-width:320px;margin-left:auto;margin-right:auto}
.gap-label{font-size:11px;color:var(--muted)}.gap-val{font-size:14px;font-weight:800;color:var(--gold)}
.explain{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.35;max-width:300px;margin-left:auto;margin-right:auto;padding:0 6px}

/* stable progress (no blink) */
.progress-wrap{padding:10px;margin-top:6px}
.progress-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4d95ff,#3dd6c6);border-radius:2px;transition:width .4s linear}
</style>
</head>
<body>
<div id="app">
  <div class="particles" id="particles"></div>
  <div id="content"></div>
  <div class="nav-wrap" id="navWrap">
    <nav class="nav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item active" id="navArenas">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Арены
      </button>
      <button class="nav-item" id="navProfile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>Профиль
      </button>
    </nav>
  </div>
</div>
<script>
(function(){
  (function(){const c=document.getElementById('particles');if(!c)return;for(let i=0;i<10;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(12+Math.random()*14)+'s';p.style.animationDelay=(Math.random()*10)+'s';p.style.width=p.style.height=(1.4+Math.random()*1.6)+'px';c.appendChild(p)}})();

  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();if(tg.expand)tg.expand();try{if(tg.setHeaderColor)tg.setHeaderColor('#0b1220');if(tg.setBackgroundColor)tg.setBackgroundColor('#0b1220')}catch(e){}}

  function haptic(t){try{const hf=tg&&tg.HapticFeedback;if(!hf)return;if(t==='success'||t==='error'||t==='warning')hf.notificationOccurred(t);else hf.impactOccurred(t==='medium'?'medium':t==='heavy'?'heavy':'light')}catch(e){}}

  let audioCtx=null;
  function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
  function tone(freq,start,dur,type,vol){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,audioCtx.currentTime+start);
    g.gain.setValueAtTime(0,audioCtx.currentTime+start);
    g.gain.linearRampToValueAtTime(vol||.11,audioCtx.currentTime+start+.015);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+start+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+dur+.04);
  }
  function playWin(){try{ensureAudio();tone(523,0,.11,'square',.13);tone(659,.1,.11,'square',.12);tone(784,.2,.16,'square',.13);tone(1046,.34,.24,'triangle',.09)}catch(e){}}
  function playLoss(){try{ensureAudio();tone(392,0,.09,'square',.1);tone(349,.11,.09,'square',.09);tone(311,.22,.09,'square',.08);tone(262,.33,.2,'triangle',.07)}catch(e){}}

  function getRank(pts){if(pts>=2000)return'TRUE ADAM';if(pts>=1000)return'CHAD';if(pts>=500)return'HTN';if(pts>=150)return'LTN';return'SAB'}
  function ptsToNext(pts){const m=[50,150,500,1000,2000],n=['SAB','LTN','HTN','CHAD','TRUE ADAM'];if(pts<50)return{next:'SAB',need:50-pts};for(let i=0;i<m.length-1;i++)if(pts>=m[i]&&pts<m[i+1])return{next:n[i+1],need:m[i+1]-pts};return{next:null,need:0}}
  function makeScores(seed){const r=n=>Math.round((3.2+((seed*n*17)%65)/10)*100)/100;return{avatar:r(1),username:r(2),bio:r(3),gifts:r(4),giftValue:r(5),accountAge:r(6),telegramLevel:r(7)}}
  function overall(s){const v=[s.avatar,s.username,s.bio,s.gifts,s.giftValue,s.accountAge,s.telegramLevel];return Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100}

  const RAW=[
    {id:1,username:'raizen',pts:2450,winStreak:17,wins:42,losses:8,battlesPlayed:50},
    {id:2,username:'Mr_mkfr',pts:380,winStreak:0,wins:5,losses:12,battlesPlayed:17},
    {id:3,username:'neon',pts:1120,winStreak:5,wins:28,losses:11,battlesPlayed:39},
    {id:4,username:'voidx',pts:620,winStreak:2,wins:15,losses:9,battlesPlayed:24},
    {id:5,username:'chadgod',pts:1580,winStreak:9,wins:35,losses:6,battlesPlayed:41},
    {id:6,username:'lumen',pts:2100,winStreak:12,wins:48,losses:7,battlesPlayed:55},
  ];
  const PLAYERS=RAW.map((p,i)=>{let scores=makeScores(p.id*13+i);if(p.pts>=2000)scores={avatar:6.62,username:9.48,bio:5.0,gifts:8.71,giftValue:7.96,accountAge:9.0,telegramLevel:4.05};if(p.username==='Mr_mkfr')scores={avatar:2.88,username:4.62,bio:5.0,gifts:3.84,giftValue:4.31,accountAge:2.10,telegramLevel:1.68};return{...p,rank:getRank(p.pts),scores,overallScore:overall(scores)}});

  const BB=[
    {title:'New Season',sub:'x2.5 PTS Weekend',g:'linear-gradient(135deg,#1e4570,#122038 55%,#1a4d6e)'},
    {title:'MOG Arena',sub:'Full profile battles',g:'linear-gradient(135deg,#2e2060,#122038 55%,#3a2a70)'},
    {title:'LARP Arena',sub:'Gifts collection wars',g:'linear-gradient(135deg,#1a5040,#122038 55%,#1a6050)'},
  ];

  let user=null;
  try{const r=localStorage.getItem('larp_user');if(r)user=JSON.parse(r)}catch(e){}
  const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(tgUser){
    const tgUsername=(tgUser.username||(tgUser.first_name||'player')).toLowerCase().replace(/\s+/g,'_');
    const tgPhoto=tgUser.photo_url||null;
    if(!user){
      user={id:tgUser.id,username:tgUsername,firstName:tgUser.first_name||'',photoUrl:tgPhoto,isPremium:!!tgUser.is_premium,pts:50,winStreak:0,wins:0,losses:0,battlesPlayed:0,hideFromLB:false,scores:makeScores(tgUser.id||1)};
      user.rank=getRank(user.pts);user.overallScore=overall(user.scores);
    } else {
      user.id=tgUser.id;user.username=tgUsername;user.firstName=tgUser.first_name||user.firstName||'';
      user.photoUrl=tgPhoto||user.photoUrl||null;user.isPremium=!!tgUser.is_premium;
    }
  } else if(!user){
    user={...PLAYERS[0],id:0,photoUrl:null,hideFromLB:false};
  }
  user.rank=getRank(user.pts||0);
  if(!user.scores)user.scores=makeScores(user.id||1);
  if(!user.overallScore)user.overallScore=overall(user.scores);
  try{localStorage.setItem('larp_user',JSON.stringify(user))}catch(e){}

  let history=[];try{const r=localStorage.getItem('larp_hist');if(r)history=JSON.parse(r)}catch(e){}
  if(!history.length)history=[{id:'h1',opponent:'Mr_mkfr',mode:'MOG',result:'WIN',ptsDelta:25,date:'2026-08-07'},{id:'h2',opponent:'neon',mode:'LARP',result:'WIN',ptsDelta:25,date:'2026-08-06'},{id:'h3',opponent:'chadgod',mode:'MOG',result:'LOSS',ptsDelta:-25,date:'2026-08-05'}];
  function save(){try{localStorage.setItem('larp_user',JSON.stringify(user));localStorage.setItem('larp_hist',JSON.stringify(history.slice(0,40)))}catch(e){}}

  let screen='arenas',mode='MOG',opponent=null,searchSec=0,searchIv=null,battleIv=null;
  let barVis=0,myScores=null,oppScores=null,myOv=0,oppOv=0,winnerId=null;
  let commentary='',tips=[],bbIdx=0,navIndex=0,showRankUp=false,histExpanded=false;

  function avatarHTML(name,cls,photoUrl,gold){
    const letter=(name||'?')[0].toUpperCase();
    const extra=gold?' avatar-gold':'';
    const inner=photoUrl
      ? '<img src="'+photoUrl+'" alt="" onerror="this.style.display=\'none\';this.parentNode.appendChild(document.createTextNode(\''+letter+'\'))"/>'
      : letter;
    return '<div class="avatar-wrap"><div class="avatar '+(cls||'')+extra+'">'+inner+'</div></div>';
  }

  function jitter(b){return Math.round(Math.min(10,Math.max(1,b+(Math.random()-.5)*.5))*100)/100}
  function computeScores(p,m){const s={...p.scores};if(m==='LARP'){s.gifts=jitter(s.gifts+.12);s.giftValue=jitter(s.giftValue+.15)}else{s.avatar=jitter(s.avatar);s.username=jitter(s.username)}return s}
  function overallMode(s,m){if(m==='LARP')return Math.round(Math.min(10,s.gifts*.55+s.giftValue*.45)*100)/100;return overall(s)}
  function findOpp(){const o=PLAYERS.filter(p=>p.id!==user.id).sort((a,b)=>Math.abs(a.pts-user.pts)-Math.abs(b.pts-user.pts));return o.slice(0,4)[Math.floor(Math.random()*Math.min(4,o.length))]||o[0]}
  function applyPts(isWin){const prev=user.rank;user.pts=Math.max(0,user.pts+(isWin?25:-25));user.rank=getRank(user.pts);if(isWin){user.wins++;user.winStreak++}else{user.losses++;user.winStreak=0}user.battlesPlayed++;if(prev!==user.rank&&isWin)showRankUp=true;save()}

  function setNav(idx){navIndex=idx;const pill=document.getElementById('navPill');if(pill)pill.style.transform='translateX('+(idx*100)+'%)';document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active',i===idx))}
  function showNav(show){const w=document.getElementById('navWrap');if(w)w.style.display=show?'block':'none'}

  function go(s){
    haptic('light');screen=s;
    if(s==='arenas'){setNav(0);showNav(true)}
    else if(s==='profile'){setNav(1);showNav(true)}
    else showNav(false);
    renderContent(true);
  }

  function startSearch(m){
    haptic('medium');
    mode=m;opponent=null;searchSec=0;screen='search';showNav(false);renderContent(true);
    if(searchIv)clearInterval(searchIv);
    const t0=Date.now();
    searchIv=setInterval(function(){
      searchSec=Math.floor((Date.now()-t0)/1000);
      if(searchSec>=2+Math.floor(Math.random()*2)&&!opponent){
        clearInterval(searchIv);opponent=findOpp();haptic('success');renderContent(true);
        setTimeout(function(){startBattle(mode,opponent)},900);
      } else if(searchSec>=60&&!opponent){clearInterval(searchIv);renderContent(true)}
      else if(!opponent){
        const el=document.getElementById('searchTimer');
        if(el){const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');el.textContent=mode+' · '+mm+':'+ss}
      }
    },400);
  }
  function cancelSearch(){if(searchIv)clearInterval(searchIv);haptic('light');setTimeout(function(){haptic('light')},80);go('arenas')}

  function startBattle(m,opp){
    opponent=opp;barVis=0;
    myScores=computeScores(user,m);oppScores=computeScores(opp,m);
    myOv=overallMode(myScores,m);oppOv=overallMode(oppScores,m);
    winnerId=myOv>=oppOv?user.id:opp.id;
    const ws=winnerId===user.id?myScores:oppScores;const ls=winnerId===user.id?oppScores:myScores;
    const reasons=[];
    if(ws.username>ls.username+.3)reasons.push('юзернейм');
    if(ws.gifts>ls.gifts+.3)reasons.push('коллекция подарков');
    if(ws.giftValue>ls.giftValue+.3)reasons.push('стоимость gifts');
    if(ws.avatar>ls.avatar+.3)reasons.push('аватар');
    if(!reasons.length)reasons.push('общий баланс профиля');
    commentary=winnerId===user.id?'Мемная аватарка душит юзернейм, а витрина подарков пока просто фон':'Противник сильнее по ключевым параметрам профиля';
    tips=[];if(ls.avatar<7)tips.push('Улучши аватар');if(ls.username<7)tips.push('Сделай username чище');if(ls.gifts<7)tips.push('Собери более редкие Gifts');if(!tips.length)tips.push('Продолжай в том же духе');
    screen='battle';showNav(false);haptic('heavy');setTimeout(function(){haptic('medium')},100);setTimeout(function(){haptic('heavy')},220);renderContent(true);
    if(battleIv)clearInterval(battleIv);
    let n=0;
    battleIv=setInterval(function(){
      n++;barVis=n;
      // update ONLY progress bar — no full re-render, no blink
      const fill=document.getElementById('battleProgress');
      if(fill)fill.style.width=Math.min(100,n*12.5)+'%';
      if(n>=8){clearInterval(battleIv);setTimeout(finishBattle,600)}
    },650);
  }
  function finishBattle(){
    const isWin=winnerId===user.id;
    haptic(isWin?'success':'error');
    if(isWin)playWin();else playLoss();
    applyPts(isWin);
    history.unshift({id:'b'+Date.now(),opponent:opponent.username,mode:mode,result:isWin?'WIN':'LOSS',ptsDelta:isWin?25:-25,date:new Date().toISOString().slice(0,10)});
    save();screen='result';showNav(false);renderContent(true);
  }

  function barRows(scores,gold){
    const labels=[{k:'avatar',l:'Аватар'},{k:'username',l:'@username'},{k:'bio',l:'О себе'},{k:'gifts',l:'Подарки'},{k:'giftValue',l:'Стоимость'},{k:'accountAge',l:'Дата рег.'},{k:'telegramLevel',l:'Уровень TG'}];
    return labels.map(function(item){
      const v=scores[item.k]||0;const pct=Math.min(100,v*10);
      return '<div class="bar-row"><div class="bar-label"><b>'+item.l+'</b></div><div class="bar-track"><div class="bar-fill '+(gold?'gold':'grey')+'" style="width:'+pct+'%"></div></div><div class="bar-score'+(gold?'':' dim')+'">'+v.toFixed(2)+'</div></div>';
    }).join('');
  }

  function renderArenas(){
    return '<div class="screen">'+
      '<div class="bb-wrap"><div class="bb-track" id="bbTrack">'+
        BB.map(b=>'<div class="bb" style="background:'+b.g+'"><div class="bb-title">'+b.title+'</div><div class="bb-sub">'+b.sub+'</div></div>').join('')+
      '</div><div class="dots">'+BB.map((_,i)=>'<div class="dot'+(i===bbIdx?' on':'')+'"></div>').join('')+'</div></div>'+
      '<div class="card user-strip"><div class="row">'+
        avatarHTML(user.username,null,user.photoUrl)+
        '<div style="flex:1"><div style="font-weight:700;font-size:13px">@'+user.username+'</div>'+
        '<div style="display:flex;gap:6px;margin-top:2px;align-items:center"><span class="rank">'+user.rank+'</span><span class="muted">'+user.pts+' PTS</span></div></div>'+
        (user.winStreak>0?'<div style="text-align:center"><div style="font-size:13px">🔥</div><div style="font-weight:700;font-size:11px">'+user.winStreak+'</div></div>':'')+
      '</div></div>'+
      '<div class="arena-grid">'+
        '<div class="card arena arena-larp"><div class="arena-title" style="color:#3dd6c6">LARP</div><div class="arena-desc">Только Gifts: редкость, дизайн и ценность подарков. AI сравнивает коллекции.</div><button class="btn btn-primary btn-block" onclick="App.startSearch(\'LARP\')">Играть</button></div>'+
        '<div class="card arena arena-mog"><div class="arena-title" style="color:#5aadff">MOG</div><div class="arena-desc">Полный профиль: avatar, username, bio, gifts, age, Premium</div><button class="btn btn-primary btn-block" onclick="App.startSearch(\'MOG\')">Играть</button></div>'+
      '</div></div>';
  }

  function renderSearch(){
    const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');
    let extra='';
    if(opponent){
      extra='<div class="card" style="padding:12px;width:100%;text-align:center">'+avatarHTML(opponent.username)+
        '<div style="margin-top:6px;font-weight:700;font-size:13px">@'+opponent.username+'</div><div class="muted">'+opponent.rank+' · '+opponent.pts+' PTS</div></div>';
    } else if(searchSec>=60){
      extra='<div class="muted" style="margin-bottom:8px">Соперник не найден</div><button class="btn btn-primary" onclick="App.startSearch(\''+mode+'\')">Ещё раз</button><button class="btn btn-ghost" style="margin-top:6px" onclick="App.go(\'arenas\')">Назад</button>';
    } else {
      extra='<button class="btn btn-danger" onclick="App.cancelSearch()">Отменить</button>';
    }
    return '<div class="screen"><div class="search-wrap"><div class="ring"><div class="ring-orbit"></div>'+avatarHTML(user.username,'avatar-lg',user.photoUrl)+'</div>'+
      '<div class="h2 '+(opponent?'':'pulse')+'">'+(opponent?'Соперник найден!':'Поиск...')+'</div>'+
      '<div class="muted" id="searchTimer">'+mode+' · '+mm+':'+ss+'</div>'+extra+'</div></div>';
  }

  function renderBattle(){
    // static layout — progress updates via DOM only, no re-render blink
    return '<div class="screen no-fade"><div class="battle-title">'+mode+' BATTLE</div>'+
      '<div class="player-block">'+avatarHTML(user.username,'avatar-lg',user.photoUrl)+
      '<div class="player-name">@'+user.username+'</div><div class="muted">'+user.rank+'</div></div>'+
      '<div class="vs-divider"><span class="vs-text">VS</span></div>'+
      '<div class="player-block">'+avatarHTML(opponent.username,'avatar-lg')+
      '<div class="player-name">@'+opponent.username+'</div><div class="muted">'+opponent.rank+'</div></div>'+
      '<div class="card progress-wrap"><div class="muted" style="margin-bottom:6px;font-size:10px;text-align:center">Анализ профиля...</div>'+
      '<div class="progress-track"><div class="progress-fill" id="battleProgress" style="width:'+(barVis*12.5)+'%"></div></div></div></div>';
  }

  function renderResult(){
    const iWin=winnerId===user.id;
    const winP=iWin?user:opponent, winS=iWin?myScores:oppScores, winOv=iWin?myOv:oppOv;
    const loseP=iWin?opponent:user, loseS=iWin?oppScores:myScores, loseOv=iWin?oppOv:myOv;
    const gap=Math.abs(winOv-loseOv).toFixed(2);
    return '<div class="screen">'+
      '<div class="battle-title">'+mode+' BATTLE</div>'+
      '<div class="player-block"><div class="crown">👑</div>'+
        '<div style="position:relative;display:inline-block">'+avatarHTML(winP.username,'avatar-lg',winP.photoUrl,true)+'<div class="avatar-orbit avatar-orbit-gold"></div></div>'+
        '<div class="badge-host">HOST PROFILE</div>'+
        '<div class="player-name">'+winP.username+'</div><div class="player-handle">@'+winP.username+'</div>'+
        '<div class="mini-stats">'+
          '<div class="mini-stat"><div class="mini-stat-val gold">'+winOv.toFixed(2)+'</div><div class="mini-stat-label">Overall</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val gold" style="font-size:11px">'+winP.rank+'</div><div class="mini-stat-label">Rank</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+winP.battlesPlayed+'</div><div class="mini-stat-label">Battles</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+winP.winStreak+'</div><div class="mini-stat-label">Streak</div></div>'+
        '</div><div class="bars">'+barRows(winS,true)+'</div></div>'+
      '<div class="vs-divider"><span class="vs-text">VS</span></div>'+
      '<div class="player-block mogged"><div class="mogged-stamp">MOGGED</div>'+
        avatarHTML(loseP.username,'avatar-lg',loseP.photoUrl)+
        '<div class="badge-guest">GUEST PROFILE</div>'+
        '<div class="player-name">@'+loseP.username+'</div><div class="player-handle dim">@'+loseP.username+'</div>'+
        '<div class="mini-stats">'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseOv.toFixed(2)+'</div><div class="mini-stat-label">Overall</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val" style="font-size:11px">'+loseP.rank+'</div><div class="mini-stat-label">Rank</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseP.battlesPlayed+'</div><div class="mini-stat-label">Battles</div></div>'+
          '<div class="mini-stat"><div class="mini-stat-val">'+loseP.winStreak+'</div><div class="mini-stat-label">Streak</div></div>'+
        '</div><div class="bars">'+barRows(loseS,false)+'</div></div>'+
      '<div class="gap-row"><span class="gap-label">Разрыв</span><span class="gap-val">'+gap+'</span></div>'+
      '<div class="explain">'+commentary+'</div>'+
      '<div style="text-align:center;margin:10px 0 6px"><div style="font-size:13px;font-weight:700;color:'+(iWin?'var(--win)':'var(--danger)')+'">'+(iWin?'+25':'-25')+' PTS → '+user.pts+'</div>'+
      (showRankUp?'<div class="muted" style="color:var(--cyan);margin-top:3px">RANK UP! '+user.rank+'</div>':'')+'</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.go(\'arenas\')">На арену</button>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:6px" onclick="App.startSearch(\''+mode+'\')">Ещё битва</button></div>';
  }

  function renderProfile(){
    const nr=ptsToNext(user.pts);
    return '<div class="screen"><div class="profile-header">'+
      '<div style="position:relative">'+avatarHTML(user.username,'avatar-lg',user.photoUrl)+'<div class="avatar-orbit"></div></div>'+
      '<div class="h1">@'+user.username+'</div><div class="energy-line"></div>'+
      '<span class="rank">'+user.rank+'</span>'+
      '<div class="muted">'+user.pts+' PTS'+(user.winStreak>0?' · 🔥 '+user.winStreak:'')+'</div>'+
      (nr.next?'<div class="muted" style="font-size:10px">До '+nr.next+': '+nr.need+' PTS</div>':'')+
      '</div>'+
      '<div class="stat-grid">'+
        '<div class="card stat-box"><div class="stat-val">'+(user.overallScore||0).toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.battlesPlayed+'</div><div class="stat-label">Battles</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.wins+'</div><div class="stat-label">Wins</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.losses+'</div><div class="stat-label">Losses</div></div></div>'+
      '<div class="card toggle" onclick="App.toggleHideLB()">'+
        '<div><div style="font-weight:600;font-size:12px">Скрыть из Leaderboard</div><div class="muted" style="font-size:10px">Когда появится Топ</div></div>'+
        '<div class="toggle-sw'+(user.hideFromLB?' on':'')+'"><div class="toggle-kn"></div></div></div>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px">'+
        '<div class="h2" style="margin:0">История</div>'+
        (history.length>3?'<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="App.toggleHist()">'+(histExpanded?'Скрыть':'Показать всё')+'</button>':'')+
      '</div>'+
      history.slice(0,histExpanded?30:3).map(h=>'<div class="card hist"><div><div style="font-weight:600;font-size:12px">'+(h.result==='WIN'?'🏆':'💀')+' @'+h.opponent+'</div><div class="muted">'+h.mode+' · '+h.date+'</div></div><div style="font-weight:700;font-size:12px;color:'+(h.result==='WIN'?'var(--win)':'var(--danger)')+'">'+(h.ptsDelta>0?'+':'')+h.ptsDelta+'</div></div>').join('')+
    '</div>';
  }

  function renderContent(withFade){
    const box=document.getElementById('content');if(!box)return;
    let html='';
    if(screen==='arenas')html=renderArenas();
    else if(screen==='search')html=renderSearch();
    else if(screen==='battle')html=renderBattle();
    else if(screen==='result'){html=renderResult();showRankUp=false}
    else if(screen==='profile')html=renderProfile();
    box.innerHTML=html;
    const track=document.getElementById('bbTrack');
    if(track){track.onscroll=function(){bbIdx=Math.round(track.scrollLeft/track.clientWidth);document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===bbIdx))}}
  }

  document.getElementById('navArenas').onclick=function(){go('arenas')};
  document.getElementById('navProfile').onclick=function(){go('profile')};
  window.App={
    go:go,startSearch:startSearch,cancelSearch:cancelSearch,
    toggleHideLB:function(){user.hideFromLB=!user.hideFromLB;save();haptic('light');renderContent(true)},
    toggleHist:function(){histExpanded=!histExpanded;haptic('light');renderContent(true)}
  };
  setNav(0);renderContent(true);
})();
</script>
</body>
</html>
