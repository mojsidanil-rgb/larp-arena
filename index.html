<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e14"/>
<title>Larp Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#0a0e14; --card:rgba(22,30,42,.88); --border:rgba(80,120,180,.15);
  --text:#e8eef7; --muted:#8b9bb4; --blue:#4da3ff; --cyan:#3dd6c6;
  --glow:rgba(77,163,255,.35); --danger:#ff5c7a; --win:#3dd68c;
  --safe:env(safe-area-inset-bottom,0px); --nav:64px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text); background:var(--bg); line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(50,100,180,.18),transparent),var(--bg)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav) + var(--safe) + 12px);-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,.35)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);
  display:flex;align-items:center;justify-content:space-around;background:rgba(10,14,20,.92);
  border-top:1px solid var(--border);backdrop-filter:blur(20px);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;color:var(--muted);font-size:11px;background:none;border:none;cursor:pointer}
.nav-item.active{color:var(--blue);text-shadow:0 0 12px var(--glow)}
.nav-icon{font-size:20px;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-weight:600;font-size:15px;border:none;cursor:pointer;color:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#3d8bfd,#2a6adf);color:#fff;box-shadow:0 4px 20px rgba(61,139,253,.4)}
.btn-ghost{background:rgba(77,163,255,.1);border:1px solid rgba(77,163,255,.25);color:var(--blue)}
.btn-danger{background:rgba(255,92,122,.15);border:1px solid rgba(255,92,122,.3);color:var(--danger)}
.btn-block{width:100%}
.h1{font-size:22px;font-weight:700}.h2{font-size:17px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.rank{display:inline-flex;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(77,163,255,.15);color:var(--blue);border:1px solid rgba(77,163,255,.25)}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar-label{width:100px;font-size:12px;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3d8bfd,#3dd6c6);transition:width .6s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(61,139,253,.5)}
.bar-val{width:36px;text-align:right;font-size:12px;font-weight:600}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2a4a7a);border:2px solid rgba(77,163,255,.4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--blue);flex-shrink:0}
.avatar-lg{width:88px;height:88px;font-size:32px}.avatar-sm{width:40px;height:40px;font-size:14px}
.bb-wrap{margin-bottom:16px}
.bb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.bb-track::-webkit-scrollbar{display:none}
.bb{min-width:100%;scroll-snap-align:start;height:120px;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border);position:relative;overflow:hidden}
.bb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(77,163,255,.2),transparent 50%);pointer-events:none}
.bb-title{font-size:20px;font-weight:700;position:relative;z-index:1}
.bb-sub{font-size:13px;color:rgba(255,255,255,.7);position:relative;z-index:1}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}.dot.on{background:var(--blue);box-shadow:0 0 8px var(--glow)}
.arena{padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.arena::before{content:'';position:absolute;top:-40%;right:-20%;width:160px;height:160px;border-radius:50%;opacity:.15;pointer-events:none}
.arena-larp::before{background:#3dd6c6}.arena-mog::before{background:#4da3ff}
.arena-title{font-size:20px;font-weight:800;letter-spacing:.04em;margin-bottom:6px}
.arena-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.45}
.search-wrap{display:flex;flex-direction:column;align-items:center;padding-top:48px;gap:24px}
.ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid transparent;border-top-color:var(--blue);border-right-color:var(--cyan);animation:spin 1.2s linear infinite;box-shadow:0 0 20px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.vs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}
.vs-player{flex:1;text-align:center}
.vs-badge{font-size:22px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.score-big{font-size:28px;font-weight:800;background:linear-gradient(135deg,#4da3ff,#3dd6c6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-win{color:var(--win);font-size:32px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 24px rgba(61,214,140,.5);text-align:center}
.result-loss{color:var(--danger);font-size:32px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 24px rgba(255,92,122,.4);text-align:center}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.lb-place{width:28px;font-weight:700;font-size:14px;color:var(--muted);text-align:center}.lb-place.top{color:var(--blue)}
.profile-header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0 16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat-box{padding:14px;text-align:center}
.stat-val{font-size:20px;font-weight:700}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.hist{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:8px}
.fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ tg.ready(); tg.expand && tg.expand(); try{ tg.setHeaderColor && tg.setHeaderColor('#0a0e14'); tg.setBackgroundColor && tg.setBackgroundColor('#0a0e14'); }catch(e){} }

  function haptic(t){
    try{
      const hf = tg && tg.HapticFeedback; if(!hf) return;
      if(t==='success'||t==='error') hf.notificationOccurred(t);
      else hf.impactOccurred(t==='medium'?'medium':'light');
    }catch(e){}
  }

  function getRank(pts){
    if(pts>=2000) return 'TRUE ADAM';
    if(pts>=1000) return 'CHAD';
    if(pts>=500) return 'HTN';
    if(pts>=150) return 'LTN';
    return 'SAB';
  }
  function getLevel(pts){
    if(pts>=2000) return 5; if(pts>=1000) return 4; if(pts>=500) return 3; if(pts>=150) return 2; return 1;
  }
  function ptsToNext(pts){
    const mins=[50,150,500,1000,2000], names=['SAB','LTN','HTN','CHAD','TRUE ADAM'];
    if(pts<50) return {next:'SAB',need:50-pts};
    for(let i=0;i<mins.length-1;i++){
      if(pts>=mins[i] && pts<mins[i+1]) return {next:names[i+1],need:mins[i+1]-pts};
    }
    return {next:null,need:0};
  }

  function makeScores(seed){
    const r=n=>Math.round((3+((seed*n*17)%70)/10)*100)/100;
    return {avatar:r(1),username:r(2),bio:r(3),gifts:r(4),giftValue:r(5),accountAge:r(6),telegramLevel:r(7)};
  }
  function overall(s){
    const v=[s.avatar,s.username,s.bio,s.gifts,s.giftValue,s.accountAge,s.telegramLevel];
    return Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100;
  }

  const RAW=[
    {id:1,username:'raizen',pts:2450,winStreak:17,wins:42,losses:8,battlesPlayed:50,isPremium:true,telegramLevel:10,accountYear:2014,giftsCount:12,giftsValueUsd:2700},
    {id:2,username:'Mr_mkfr',pts:380,winStreak:0,wins:5,losses:12,battlesPlayed:17,isPremium:false,telegramLevel:4,accountYear:2022,giftsCount:21,giftsValueUsd:380},
    {id:3,username:'neon',pts:1120,winStreak:5,wins:28,losses:11,battlesPlayed:39,isPremium:true,telegramLevel:8,accountYear:2018,giftsCount:9,giftsValueUsd:890},
    {id:4,username:'voidx',pts:620,winStreak:2,wins:15,losses:9,battlesPlayed:24,isPremium:false,telegramLevel:6,accountYear:2019,giftsCount:6,giftsValueUsd:420},
    {id:5,username:'sakura',pts:180,winStreak:3,wins:8,losses:4,battlesPlayed:12,isPremium:true,telegramLevel:5,accountYear:2020,giftsCount:15,giftsValueUsd:210},
    {id:6,username:'chadgod',pts:1580,winStreak:9,wins:35,losses:6,battlesPlayed:41,isPremium:true,telegramLevel:12,accountYear:2015,giftsCount:20,giftsValueUsd:4500},
    {id:7,username:'pixel',pts:95,winStreak:1,wins:3,losses:5,battlesPlayed:8,isPremium:false,telegramLevel:2,accountYear:2023,giftsCount:4,giftsValueUsd:45},
    {id:8,username:'onyx',pts:890,winStreak:4,wins:22,losses:10,battlesPlayed:32,isPremium:true,telegramLevel:7,accountYear:2017,giftsCount:11,giftsValueUsd:1200},
    {id:9,username:'lumen',pts:2100,winStreak:12,wins:48,losses:7,battlesPlayed:55,isPremium:true,telegramLevel:11,accountYear:2013,giftsCount:18,giftsValueUsd:8900},
    {id:10,username:'ghost',pts:40,winStreak:0,wins:1,losses:6,battlesPlayed:7,isPremium:false,telegramLevel:1,accountYear:2024,giftsCount:2,giftsValueUsd:12},
  ];

  const PLAYERS=RAW.map((p,i)=>{
    let scores=makeScores(p.id*13+i);
    if(p.pts>=2000){scores={avatar:8.2,username:9.5,bio:7.0,gifts:9.1,giftValue:9.4,accountAge:9.6,telegramLevel:8.5};}
    return {...p,rank:getRank(p.pts),level:getLevel(p.pts),scores,overallScore:overall(scores)};
  });

  const BB=[
    {title:'New Season',sub:'x2.5 PTS Weekend',g:'linear-gradient(135deg,#1a3a5c,#0d1b2a 50%,#1b4d6e)'},
    {title:'MOG Arena',sub:'Full profile battles',g:'linear-gradient(135deg,#2a1a4a,#0d1b2a 50%,#3d2a6b)'},
    {title:'LARP Arena',sub:'Gifts collection wars',g:'linear-gradient(135deg,#1a4a3a,#0d1b2a 50%,#1b6e4d)'},
  ];

  let user=null;
  try{ const r=localStorage.getItem('larp_user'); if(r) user=JSON.parse(r);}catch(e){}
  if(!user) user={...PLAYERS[0]};
  user.rank=getRank(user.pts); user.level=getLevel(user.pts);

  let history=[];
  try{ const r=localStorage.getItem('larp_hist'); if(r) history=JSON.parse(r);}catch(e){}
  if(!history.length){
    history=[
      {id:'h1',opponent:'Mr_mkfr',mode:'MOG',result:'WIN',ptsDelta:25,date:'2026-08-07'},
      {id:'h2',opponent:'neon',mode:'LARP',result:'WIN',ptsDelta:25,date:'2026-08-06'},
      {id:'h3',opponent:'chadgod',mode:'MOG',result:'LOSS',ptsDelta:-25,date:'2026-08-05'},
    ];
  }

  function save(){ try{ localStorage.setItem('larp_user',JSON.stringify(user)); localStorage.setItem('larp_hist',JSON.stringify(history.slice(0,50))); }catch(e){} }

  let screen='home', mode='MOG', opponent=null, searchSec=0, searchIv=null;
  let barVis=0, myScores=null, oppScores=null, myOv=0, oppOv=0, winnerId=null, commentary='', tips=[], viewPlayer=null, bbIdx=0;

  function avatar(name,cls){ return '<div class="avatar '+(cls||'')+'">'+(name||'?')[0].toUpperCase()+'</div>'; }
  function bars(s,n){
    const e=[['Avatar',s.avatar],['Username',s.username],['Bio',s.bio],['Gifts',s.gifts],['Gift Value',s.giftValue],['Account Age',s.accountAge],['TG Level',s.telegramLevel]];
    return e.slice(0,n).map(([l,v])=>'<div class="bar-row"><span class="bar-label">'+l+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(v*10)+'%"></div></div><span class="bar-val">'+v.toFixed(2)+'</span></div>').join('');
  }

  function jitter(b){ return Math.round(Math.min(10,Math.max(1,b+(Math.random()-.5)*1.2))*100)/100; }
  function computeScores(p,m){
    const s={...p.scores};
    if(m==='LARP'){ s.gifts=jitter(s.gifts+.3); s.giftValue=jitter(s.giftValue+.4); }
    else { s.avatar=jitter(s.avatar+.2); s.username=jitter(s.username+.2); }
    return s;
  }
  function overallMode(s,m){
    if(m==='LARP'){
      return Math.round(Math.min(10,s.gifts*.25+s.giftValue*.22+s.avatar*.1+s.username*.12+s.bio*.06+s.accountAge*.12+s.telegramLevel*.13)*100)/100;
    }
    return overall(s);
  }
  function findOpp(){
    const o=PLAYERS.filter(p=>p.id!==user.id).sort((a,b)=>Math.abs(a.pts-user.pts)-Math.abs(b.pts-user.pts));
    const pool=o.slice(0,3); return pool[Math.floor(Math.random()*pool.length)]||o[0];
  }
  function applyPts(isWin){
    user.pts=Math.max(0,user.pts+(isWin?25:-25));
    user.rank=getRank(user.pts); user.level=getLevel(user.pts);
    if(isWin){ user.wins++; user.winStreak++; } else { user.losses++; user.winStreak=0; }
    user.battlesPlayed++;
    save();
  }

  function go(s){ haptic('light'); screen=s; render(); }
  function showNav(){ return ['home','arenas','leaderboard','profile'].indexOf(screen)>=0; }

  function startSearch(m){
    haptic('medium'); mode=m; opponent=null; searchSec=0; screen='search'; render();
    if(searchIv) clearInterval(searchIv);
    const t0=Date.now();
    searchIv=setInterval(function(){
      searchSec=Math.floor((Date.now()-t0)/1000);
      if(searchSec>=2+Math.floor(Math.random()*2) && !opponent){
        clearInterval(searchIv); opponent=findOpp(); haptic('success'); render();
        setTimeout(function(){ startBattle(mode,opponent); },1200);
      }
      if(searchSec>=60 && !opponent){ clearInterval(searchIv); render(); }
      else if(!opponent) render();
    },400);
  }
  function cancelSearch(){ if(searchIv) clearInterval(searchIv); haptic('light'); go('arenas'); }

  function startBattle(m,opp){
    opponent=opp; barVis=0;
    myScores=computeScores(user,m); oppScores=computeScores(opp,m);
    myOv=overallMode(myScores,m); oppOv=overallMode(oppScores,m);
    winnerId=myOv>=oppOv?user.id:opp.id;
    const reasons=[];
    const ws=winnerId===user.id?myScores:oppScores, ls=winnerId===user.id?oppScores:myScores;
    if(ws.username>ls.username+.5) reasons.push('более сильный username');
    if(ws.gifts>ls.gifts+.5) reasons.push('более сильная коллекция Gifts');
    if(ws.giftValue>ls.giftValue+.5) reasons.push('выше ценность Gifts');
    if(ws.avatar>ls.avatar+.5) reasons.push('лучший аватар');
    if(!reasons.length) reasons.push('общий баланс профиля');
    commentary='Победа благодаря: '+reasons.slice(0,3).join(', ')+'.';
    tips=[];
    if(ls.avatar<7) tips.push('Улучши аватар');
    if(ls.username<7) tips.push('Сделай username чище');
    if(ls.bio<6) tips.push('Добавь описание профиля');
    if(ls.gifts<7) tips.push('Собери более редкие Gifts');
    if(!tips.length) tips.push('Продолжай в том же духе');
    screen='battle'; haptic('medium'); render();
    let n=0;
    const iv=setInterval(function(){
      n++; barVis=n; render();
      if(n>=7){ clearInterval(iv); setTimeout(finishBattle,1200); }
    },900);
  }
  function finishBattle(){
    const isWin=winnerId===user.id;
    haptic(isWin?'success':'error');
    applyPts(isWin);
    history.unshift({id:'b'+Date.now(),opponent:opponent.username,mode:mode,result:isWin?'WIN':'LOSS',ptsDelta:isWin?25:-25,date:new Date().toISOString().slice(0,10)});
    save(); screen='result'; render();
  }

  function renderHome(){
    const nr=ptsToNext(user.pts);
    return '<div class="screen fade"><div class="bb-wrap"><div class="bb-track" id="bbTrack">'+
      BB.map(b=>'<div class="bb" style="background:'+b.g+'"><div class="bb-title">'+b.title+'</div><div class="bb-sub">'+b.sub+'</div></div>').join('')+
      '</div><div class="dots">'+BB.map((_,i)=>'<div class="dot'+(i===bbIdx?' on':'')+'"></div>').join('')+'</div></div>'+
      '<div class="card" style="padding:16px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:14px">'+
      avatar(user.username)+'<div style="flex:1"><div style="font-weight:700">@'+user.username+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:4px;align-items:center"><span class="rank">'+user.rank+'</span><span class="muted">'+user.pts+' PTS</span></div></div>'+
      (user.winStreak>0?'<div style="text-align:center"><div style="font-size:18px">🔥</div><div style="font-weight:700;font-size:14px">'+user.winStreak+'</div></div>':'')+
      '</div><div class="stat-grid" style="margin-top:12px;margin-bottom:0">'+
      '<div class="stat-box card" style="box-shadow:none"><div class="stat-val">'+user.overallScore.toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
      '<div class="stat-box card" style="box-shadow:none"><div class="stat-val">'+user.wins+'W / '+user.losses+'L</div><div class="stat-label">Record</div></div></div></div>'+
      '<button class="btn btn-primary btn-block" onclick="App.go(\'arenas\')">Выбрать арену</button></div>';
  }
  function renderArenas(){
    return '<div class="screen fade"><div class="h1" style="margin-bottom:16px">Арены</div>'+
      '<div class="card arena arena-larp"><div class="arena-title" style="color:#3dd6c6">LARP ARENA</div>'+
      '<div class="arena-desc">Битва коллекций Telegram Gifts. Редкость, дизайн, ценность и визуальная сила коллекции.</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'LARP\')">Начать подбор</button></div>'+
      '<div class="card arena arena-mog"><div class="arena-title" style="color:#4da3ff">MOG ARENA</div>'+
      '<div class="arena-desc">Полная оценка профиля: avatar, username, bio, gifts, age, Premium и общий flex.</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'MOG\')">Начать подбор</button></div></div>';
  }
  function renderSearch(){
    const mm=String(Math.floor(searchSec/60)); const ss=String(searchSec%60).padStart(2,'0');
    let extra='';
    if(opponent){
      extra='<div class="card" style="padding:16px;width:100%;text-align:center">'+avatar(opponent.username)+
        '<div style="margin-top:8px;font-weight:700">@'+opponent.username+'</div><div class="muted">'+opponent.rank+' · '+opponent.pts+' PTS</div></div>';
    } else if(searchSec>=60){
      extra='<div class="muted">Соперник не найден</div><button class="btn btn-primary" onclick="App.startSearch(\''+mode+'\')">Попробовать ещё раз</button>'+
        '<button class="btn btn-ghost" onclick="App.go(\'arenas\')">Назад</button>';
    } else {
      extra='<button class="btn btn-danger" onclick="App.cancelSearch()">Отменить поиск</button>';
    }
    return '<div class="screen fade"><div class="search-wrap"><div class="ring">'+avatar(user.username,'avatar-lg')+'</div>'+
      '<div class="h2 pulse">'+(opponent?'Соперник найден!':'Поиск соперника...')+'</div>'+
      '<div class="muted">'+mode+' · '+mm+':'+ss+'</div>'+extra+'</div></div>';
  }
  function renderBattle(){
    return '<div class="screen fade"><div style="text-align:center;margin-bottom:8px"><div class="h2">'+mode+' BATTLE</div><div class="muted pulse">Анализ профилей...</div></div>'+
      '<div class="vs-row"><div class="vs-player">'+avatar(user.username)+'<div style="font-weight:700;margin-top:6px;font-size:13px">@'+user.username+'</div>'+
      '<div class="rank" style="margin-top:4px">'+user.rank+'</div>'+(barVis>=7?'<div class="score-big">'+myOv.toFixed(2)+'</div>':'')+'</div>'+
      '<div class="vs-badge">VS</div><div class="vs-player">'+avatar(opponent.username)+'<div style="font-weight:700;margin-top:6px;font-size:13px">@'+opponent.username+'</div>'+
      '<div class="rank" style="margin-top:4px">'+opponent.rank+'</div>'+(barVis>=7?'<div class="score-big">'+oppOv.toFixed(2)+'</div>':'')+'</div></div>'+
      (myScores?'<div class="card" style="padding:14px"><div class="muted" style="margin-bottom:8px">Твои параметры</div>'+bars(myScores,barVis)+'</div>':'')+'</div>';
  }
  function renderResult(){
    const win=winnerId===user.id;
    return '<div class="screen fade"><div style="padding:24px 16px;margin:16px 0"><div class="'+(win?'result-win':'result-loss')+'">'+(win?'🏆 WIN':'💀 LOSS')+'</div>'+
      '<div class="muted" style="margin-top:8px;text-align:center">'+(win?'+25':'-25')+' PTS → <b>'+user.pts+' PTS</b></div>'+
      '<div style="margin-top:6px;text-align:center"><span class="rank">'+user.rank+'</span>'+(user.winStreak>0?' <span style="margin-left:8px">🔥 '+user.winStreak+'</span>':'')+'</div></div>'+
      '<div class="vs-row"><div class="vs-player"><div class="score-big">'+myOv.toFixed(2)+'</div><div class="muted">@'+user.username+'</div></div>'+
      '<div class="vs-badge">VS</div><div class="vs-player"><div class="score-big">'+oppOv.toFixed(2)+'</div><div class="muted">@'+opponent.username+'</div></div></div>'+
      '<div class="card" style="padding:14px;margin-bottom:12px"><div class="h2" style="margin-bottom:6px">Почему так?</div><div class="muted">'+commentary+'</div></div>'+
      '<div class="card" style="padding:14px;margin-bottom:16px"><div class="h2" style="margin-bottom:6px">Что улучшить</div>'+tips.map(t=>'<div class="muted" style="margin-bottom:4px">· '+t+'</div>').join('')+'</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.go(\'home\')">На главную</button>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="App.startSearch(\''+mode+'\')">Ещё битва</button></div>';
  }
  function renderLB(){
    const list=[...PLAYERS].map(p=>p.id===user.id?user:p).sort((a,b)=>b.pts-a.pts);
    return '<div class="screen fade"><div class="h1" style="margin-bottom:16px">Leaderboard</div>'+
      list.map((p,i)=>'<div class="card lb-row" onclick="App.openPlayer('+p.id+')">'+
        '<div class="lb-place'+(i<3?' top':'')+'">'+(i+1)+'</div>'+avatar(p.username,'avatar-sm')+
        '<div style="flex:1"><div style="font-weight:600;font-size:14px">@'+p.username+'</div><div class="muted">'+p.rank+'</div></div>'+
        '<div style="font-weight:700;font-size:14px">'+p.pts+'</div></div>').join('')+'</div>';
  }
  function renderProfile(){
    const nr=ptsToNext(user.pts);
    return '<div class="screen fade"><div class="profile-header">'+avatar(user.username,'avatar-lg')+
      '<div class="h1">@'+user.username+'</div><span class="rank">'+user.rank+'</span>'+
      '<div class="muted">'+user.pts+' PTS'+(user.winStreak>0?' · 🔥 '+user.winStreak:'')+'</div>'+
      (nr.next?'<div class="muted">До '+nr.next+': '+nr.need+' PTS</div>':'')+'</div>'+
      '<div class="stat-grid"><div class="card stat-box"><div class="stat-val">'+user.overallScore.toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
      '<div class="card stat-box"><div class="stat-val">'+user.battlesPlayed+'</div><div class="stat-label">Battles</div></div>'+
      '<div class="card stat-box"><div class="stat-val">'+user.wins+'</div><div class="stat-label">Wins</div></div>'+
      '<div class="card stat-box"><div class="stat-val">'+user.losses+'</div><div class="stat-label">Losses</div></div></div>'+
      '<div class="h2" style="margin:8px 0 10px">Характеристики</div><div class="card" style="padding:14px;margin-bottom:16px">'+bars(user.scores,7)+'</div>'+
      '<div class="h2" style="margin:8px 0 10px">История битв</div>'+
      history.slice(0,15).map(h=>'<div class="card hist"><div><div style="font-weight:600;font-size:14px">'+(h.result==='WIN'?'🏆':'💀')+' @'+h.opponent+'</div><div class="muted">'+h.mode+' · '+h.date+'</div></div>'+
        '<div style="font-weight:700;color:'+(h.result==='WIN'?'var(--win)':'var(--danger)')+'">'+(h.ptsDelta>0?'+':'')+h.ptsDelta+'</div></div>').join('')+'</div>';
  }
  function renderPlayer(){
    const p=viewPlayer; if(!p) return '';
    return '<div class="screen fade"><button class="btn btn-ghost" style="margin-bottom:12px" onclick="App.go(\'leaderboard\')">← Назад</button>'+
      '<div class="profile-header">'+avatar(p.username,'avatar-lg')+'<div class="h1">@'+p.username+'</div><span class="rank">'+p.rank+'</span>'+
      '<div class="muted">'+p.pts+' PTS · 🔥 '+p.winStreak+'</div></div>'+
      '<div class="stat-grid"><div class="card stat-box"><div class="stat-val">'+p.overallScore.toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
      '<div class="card stat-box"><div class="stat-val">'+p.battlesPlayed+'</div><div class="stat-label">Battles</div></div></div>'+
      '<div class="card" style="padding:14px;margin-bottom:16px">'+bars(p.scores,7)+'</div>'+
      (p.id!==user.id?'<button class="btn btn-primary btn-block" onclick="App.challenge('+p.id+')">Вызвать на битву</button>':'')+'</div>';
  }

  function render(){
    const root=document.getElementById('app');
    let html='';
    if(screen==='home') html=renderHome();
    else if(screen==='arenas') html=renderArenas();
    else if(screen==='search') html=renderSearch();
    else if(screen==='battle') html=renderBattle();
    else if(screen==='result') html=renderResult();
    else if(screen==='leaderboard') html=renderLB();
    else if(screen==='profile') html=renderProfile();
    else if(screen==='player') html=renderPlayer();

    if(showNav()){
      html+='<nav class="nav">'+
        '<button class="nav-item'+(screen==='home'?' active':'')+'" onclick="App.go(\'home\')"><span class="nav-icon">🏠</span>Главная</button>'+
        '<button class="nav-item'+(screen==='arenas'?' active':'')+'" onclick="App.go(\'arenas\')"><span class="nav-icon">⚔️</span>Арены</button>'+
        '<button class="nav-item'+(screen==='leaderboard'?' active':'')+'" onclick="App.go(\'leaderboard\')"><span class="nav-icon">🏆</span>Топ</button>'+
        '<button class="nav-item'+(screen==='profile'?' active':'')+'" onclick="App.go(\'profile\')"><span class="nav-icon">👤</span>Профиль</button></nav>';
    }
    root.innerHTML=html;
    const track=document.getElementById('bbTrack');
    if(track){
      track.onscroll=function(){ bbIdx=Math.round(track.scrollLeft/track.clientWidth); 
        document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===bbIdx)); };
    }
  }

  window.App={
    go:go,
    startSearch:startSearch,
    cancelSearch:cancelSearch,
    openPlayer:function(id){ viewPlayer=PLAYERS.find(p=>p.id===id)||PLAYERS[0]; if(viewPlayer.id===user.id) viewPlayer=user; go('player'); },
    challenge:function(id){ const p=PLAYERS.find(x=>x.id===id); if(p){ opponent=p; startBattle('MOG',p); } }
  };

  render();
})();
</script>
</body>
</html>
