<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#070b12"/>
<title>Larp Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#070b12;
  --card:rgba(12,18,30,.84);
  --border:rgba(90,150,255,.24);
  --text:#edf2fa;
  --muted:#7d8fa8;
  --blue:#4da3ff;
  --blue2:#6bb8ff;
  --cyan:#3dd6c6;
  --glow:rgba(77,163,255,.35);
  --danger:#ff5c7a;
  --win:#3dd68c;
  --online:#3dd68c;
  --safe:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);background:var(--bg);line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(ellipse 100% 50% at 50% -20%,rgba(40,100,200,.12),transparent 55%),var(--bg)}

/* particles */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(120,180,255,.5);box-shadow:0 0 5px rgba(100,170,255,.35);animation:float linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.55}90%{opacity:.35}100%{transform:translateY(-8vh) scale(1);opacity:0}}

/* content area */
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav-h)+var(--safe)+12px);-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.screen{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 4px 24px rgba(0,0,0,.38),0 0 0 .5px rgba(120,170,255,.07),inset 0 1px 0 rgba(255,255,255,.04)}

/* ===== NAV — persistent, 2 tabs, narrow ===== */
.nav-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(10px + var(--safe));z-index:100;pointer-events:none}
.nav{
  pointer-events:auto;position:relative;display:flex;align-items:center;
  height:54px;padding:4px;border-radius:27px;max-width:280px;margin:0 auto;
  background:rgba(8,12,20,.85);
  border:1px solid rgba(130,170,230,.18);
  backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);
  box-shadow:0 8px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
}
.nav-pill{
  position:absolute;top:4px;left:4px;
  height:calc(100% - 8px);width:calc(50% - 4px);
  border-radius:23px;
  background:rgba(14,20,34,.98);
  border:1px solid rgba(140,185,255,.3);
  box-shadow:0 2px 12px rgba(0,0,0,.45),0 0 16px rgba(70,140,255,.14),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .34s cubic-bezier(.32,.72,.25,1);
  z-index:0;pointer-events:none;
}
.nav-item{
  position:relative;z-index:1;flex:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;cursor:pointer;
  color:rgba(150,170,200,.4);font-size:10px;font-weight:600;
  transition:color .28s ease;
}
.nav-item.active{color:#6bb8ff}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .28s,filter .28s}
.nav-item.active svg{filter:drop-shadow(0 0 7px rgba(90,170,255,.7));transform:scale(1.07)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-weight:600;font-size:15px;border:none;cursor:pointer;color:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#3d8bfd,#2a6adf);color:#fff;border:1px solid rgba(140,190,255,.3);box-shadow:0 4px 20px rgba(61,139,253,.38)}
.btn-ghost{background:rgba(60,130,220,.08);border:1px solid rgba(100,160,255,.25);color:var(--blue)}
.btn-danger{background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.28);color:var(--danger)}
.btn-block{width:100%}
.h1{font-size:22px;font-weight:700}.h2{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.rank{display:inline-flex;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(60,130,220,.12);color:var(--blue2);border:1px solid rgba(100,160,255,.3);box-shadow:0 0 12px rgba(70,150,255,.15)}

/* avatar + online */
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#15253f,#1e3558);
  border:1.5px solid rgba(110,170,255,.35);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:19px;color:var(--blue);flex-shrink:0;overflow:hidden;
  box-shadow:0 0 16px rgba(60,130,255,.16);position:relative}
.avatar-lg{width:96px;height:96px;font-size:36px;border-width:2px}
.avatar-sm{width:40px;height:40px;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{position:relative;display:inline-block}
.online-dot{
  position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;
  background:var(--online);border:2px solid var(--bg);
  box-shadow:0 0 8px rgba(61,214,140,.6);z-index:2;
}
.avatar-orbit{position:absolute;inset:-7px;border-radius:50%;border:1.5px solid transparent;
  border-top-color:rgba(90,170,255,.7);border-right-color:rgba(70,200,190,.35);
  animation:spin 3.2s linear infinite;pointer-events:none;filter:drop-shadow(0 0 4px rgba(80,160,255,.35))}
@keyframes spin{to{transform:rotate(360deg)}}

/* billboard */
.bb-wrap{margin-bottom:14px}
.bb-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.bb-track::-webkit-scrollbar{display:none}
.bb{min-width:100%;scroll-snap-align:start;height:112px;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.28)}
.bb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(77,163,255,.2),transparent 55%);pointer-events:none}
.bb-title{font-size:18px;font-weight:700;position:relative;z-index:1}
.bb-sub{font-size:12px;color:rgba(255,255,255,.62);position:relative;z-index:1;margin-top:2px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15)}.dot.on{background:var(--blue);box-shadow:0 0 7px var(--glow)}

/* arena */
.arena{padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.arena::before{content:'';position:absolute;top:-30%;right:-15%;width:130px;height:130px;border-radius:50%;opacity:.09;pointer-events:none}
.arena-larp::before{background:#3dd6c6}.arena-mog::before{background:#4da3ff}
.arena-title{font-size:18px;font-weight:800;letter-spacing:.03em;margin-bottom:5px}
.arena-desc{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.45}

/* search */
.search-wrap{display:flex;flex-direction:column;align-items:center;padding-top:48px;gap:20px}
.ring{width:136px;height:136px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring-orbit{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--blue);border-right-color:var(--cyan);
  animation:spin 1.3s linear infinite;box-shadow:0 0 18px var(--glow)}
.pulse{animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* battle */
.vs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0}
.vs-player{flex:1;text-align:center}
.vs-badge{font-size:18px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.score-big{font-size:24px;font-weight:800;margin-top:5px;background:linear-gradient(135deg,#4da3ff,#3dd6c6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-win{color:var(--win);font-size:28px;font-weight:900;letter-spacing:.05em;text-shadow:0 0 22px rgba(61,214,140,.45);text-align:center}
.result-loss{color:var(--danger);font-size:28px;font-weight:900;letter-spacing:.05em;text-shadow:0 0 22px rgba(255,92,122,.35);text-align:center}

/* profile */
.profile-header{display:flex;flex-direction:column;align-items:center;gap:9px;padding:24px 0 16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat-box{padding:13px;text-align:center}
.stat-val{font-size:19px;font-weight:700}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.energy-line{width:48px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(100,170,255,.5),transparent);margin-top:3px}
.hist{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px;margin-bottom:10px}
.toggle-sw{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.08);position:relative;transition:background .25s;cursor:pointer;border:1px solid rgba(120,160,220,.14)}
.toggle-sw.on{background:rgba(61,139,253,.4);border-color:rgba(100,160,255,.35)}
.toggle-kn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
.toggle-sw.on .toggle-kn{transform:translateX(18px)}
.online-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--online);font-weight:600}
.online-badge i{width:7px;height:7px;border-radius:50%;background:var(--online);box-shadow:0 0 6px rgba(61,214,140,.7);display:inline-block}
.rank-up{animation:rankPulse 1.15s ease}
@keyframes rankPulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 16px 16px;padding:18px;width:100%;max-width:380px;backdrop-filter:blur(22px)}
</style>
</head>
<body>
<div id="app">
  <div class="particles" id="particles"></div>
  <div id="content"></div>
  <div class="nav-wrap" id="navWrap">
    <nav class="nav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item active" data-tab="0" id="navArenas">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Арены
      </button>
      <button class="nav-item" data-tab="1" id="navProfile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
        Профиль
      </button>
    </nav>
  </div>
</div>
<script>
(function(){
  // particles
  (function(){
    const c=document.getElementById('particles');
    if(!c)return;
    for(let i=0;i<12;i++){
      const p=document.createElement('div');p.className='particle';
      p.style.left=Math.random()*100+'%';
      p.style.animationDuration=(11+Math.random()*16)+'s';
      p.style.animationDelay=(Math.random()*10)+'s';
      p.style.width=p.style.height=(1.5+Math.random()*1.8)+'px';
      c.appendChild(p);
    }
  })();

  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();if(tg.expand)tg.expand();try{if(tg.setHeaderColor)tg.setHeaderColor('#070b12');if(tg.setBackgroundColor)tg.setBackgroundColor('#070b12')}catch(e){}}

  function haptic(t){try{const hf=tg&&tg.HapticFeedback;if(!hf)return;if(t==='success'||t==='error')hf.notificationOccurred(t);else hf.impactOccurred(t==='medium'?'medium':'light')}catch(e){}}

  let audioCtx=null;
  function playSound(type){
    try{
      if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      if(type==='win'){o.frequency.setValueAtTime(523,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(784,audioCtx.currentTime+.15);g.gain.setValueAtTime(.13,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.4);o.start();o.stop(audioCtx.currentTime+.4)}
      else{o.frequency.setValueAtTime(280,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(140,audioCtx.currentTime+.28);g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.32);o.start();o.stop(audioCtx.currentTime+.32)}
    }catch(e){}
  }

  function getRank(pts){if(pts>=2000)return'TRUE ADAM';if(pts>=1000)return'CHAD';if(pts>=500)return'HTN';if(pts>=150)return'LTN';return'SAB'}
  function ptsToNext(pts){const m=[50,150,500,1000,2000],n=['SAB','LTN','HTN','CHAD','TRUE ADAM'];if(pts<50)return{next:'SAB',need:50-pts};for(let i=0;i<m.length-1;i++)if(pts>=m[i]&&pts<m[i+1])return{next:n[i+1],need:m[i+1]-pts};return{next:null,need:0}}
  function makeScores(seed){const r=n=>Math.round((3.2+((seed*n*17)%65)/10)*100)/100;return{avatar:r(1),username:r(2),bio:r(3),gifts:r(4),giftValue:r(5),accountAge:r(6),telegramLevel:r(7)}}
  function overall(s){const v=[s.avatar,s.username,s.bio,s.gifts,s.giftValue,s.accountAge,s.telegramLevel];return Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100}

  const RAW=[
    {id:1,username:'raizen',pts:2450,winStreak:17,wins:42,losses:8,battlesPlayed:50},
    {id:2,username:'Mr_mkfr',pts:380,winStreak:0,wins:5,losses:12,battlesPlayed:17},
    {id:3,username:'neon',pts:1120,winStreak:5,wins:28,losses:11,battlesPlayed:39},
    {id:4,username:'voidx',pts:620,winStreak:2,wins:15,losses:9,battlesPlayed:24},
    {id:5,username:'chadgod',pts:1580,winStreak:9,wins:35,losses:6,battlesPlayed:41},
    {id:6,username:'lumen',pts:2100,winStreak:12,wins:48,losses:7,battlesPlayed:55},
  ];
  const PLAYERS=RAW.map((p,i)=>{const scores=makeScores(p.id*13+i);return{...p,rank:getRank(p.pts),scores,overallScore:overall(scores),online:Math.random()>0.4}});

  const BB=[
    {title:'New Season',sub:'x2.5 PTS Weekend',g:'linear-gradient(135deg,#1a3a5c,#0d1b2a 50%,#1b4d6e)'},
    {title:'MOG Arena',sub:'Full profile battles',g:'linear-gradient(135deg,#2a1a4a,#0d1b2a 50%,#3d2a6b)'},
    {title:'LARP Arena',sub:'Gifts collection wars',g:'linear-gradient(135deg,#1a4a3a,#0d1b2a 50%,#1b6e4d)'},
  ];

  let user=null;
  try{const r=localStorage.getItem('larp_user');if(r)user=JSON.parse(r)}catch(e){}
  if(!user){
    const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(tgUser){
      user={id:tgUser.id,username:tgUser.username||(tgUser.first_name||'player').toLowerCase(),firstName:tgUser.first_name||'',photoUrl:tgUser.photo_url||null,isPremium:!!tgUser.is_premium,pts:50,winStreak:0,wins:0,losses:0,battlesPlayed:0,hideFromLB:false,scores:makeScores(tgUser.id||1),online:true};
      user.rank=getRank(user.pts);user.overallScore=overall(user.scores);
    } else {
      user={id:0,username:'player',photoUrl:null,pts:50,winStreak:0,wins:0,losses:0,battlesPlayed:0,hideFromLB:false,scores:makeScores(1),rank:'SAB',overallScore:5.2,online:true};
    }
  }
  user.rank=getRank(user.pts);
  user.online=true;

  let history=[];try{const r=localStorage.getItem('larp_hist');if(r)history=JSON.parse(r)}catch(e){}
  if(!history.length)history=[{id:'h1',opponent:'Mr_mkfr',mode:'MOG',result:'WIN',ptsDelta:25,date:'2026-08-07'},{id:'h2',opponent:'neon',mode:'LARP',result:'WIN',ptsDelta:25,date:'2026-08-06'},{id:'h3',opponent:'chadgod',mode:'MOG',result:'LOSS',ptsDelta:-25,date:'2026-08-05'}];

  function save(){try{localStorage.setItem('larp_user',JSON.stringify(user));localStorage.setItem('larp_hist',JSON.stringify(history.slice(0,40)))}catch(e){}}

  let screen='arenas',mode='MOG',opponent=null,searchSec=0,searchIv=null;
  let barVis=0,myScores=null,oppScores=null,myOv=0,oppOv=0,winnerId=null;
  let commentary='',tips=[],bbIdx=0,navIndex=0;
  let showChallengeModal=false,challengeTarget=null,showRankUp=false;

  function avatarHTML(name,cls,photoUrl,showOnline){
    const letter=(name||'?')[0].toUpperCase();
    let inner=photoUrl?'<img src="'+photoUrl+'" alt=""/>':letter;
    let html='<div class="avatar-wrap"><div class="avatar '+(cls||'')+'">'+inner+'</div>';
    if(showOnline) html+='<div class="online-dot"></div>';
    html+='</div>';
    return html;
  }

  function jitter(b){return Math.round(Math.min(10,Math.max(1,b+(Math.random()-.5)*.7))*100)/100}
  function computeScores(p,m){const s={...p.scores};if(m==='LARP'){s.gifts=jitter(s.gifts+.2);s.giftValue=jitter(s.giftValue+.3)}else{s.avatar=jitter(s.avatar+.1);s.username=jitter(s.username+.1)}return s}
  function overallMode(s,m){if(m==='LARP')return Math.round(Math.min(10,s.gifts*.26+s.giftValue*.24+s.avatar*.1+s.username*.1+s.bio*.06+s.accountAge*.12+s.telegramLevel*.12)*100)/100;return overall(s)}
  function findOpp(){const o=PLAYERS.filter(p=>p.id!==user.id).sort((a,b)=>Math.abs(a.pts-user.pts)-Math.abs(b.pts-user.pts));return o.slice(0,4)[Math.floor(Math.random()*Math.min(4,o.length))]||o[0]}
  function applyPts(isWin){const prev=user.rank;user.pts=Math.max(0,user.pts+(isWin?25:-25));user.rank=getRank(user.pts);if(isWin){user.wins++;user.winStreak++}else{user.losses++;user.winStreak=0}user.battlesPlayed++;if(prev!==user.rank&&isWin)showRankUp=true;save()}

  // ===== NAV (persistent) =====
  function setNav(idx){
    navIndex=idx;
    const pill=document.getElementById('navPill');
    if(pill) pill.style.transform='translateX('+(idx*100)+'%)';
    document.querySelectorAll('.nav-item').forEach((el,i)=>{
      el.classList.toggle('active',i===idx);
    });
  }
  function showNav(show){
    const w=document.getElementById('navWrap');
    if(w) w.style.display=show?'block':'none';
  }

  function go(s){
    haptic('light');
    screen=s;
    if(s==='arenas'){setNav(0);showNav(true)}
    else if(s==='profile'){setNav(1);showNav(true)}
    else showNav(false);
    showChallengeModal=false;
    renderContent();
  }

  function startSearch(m){
    haptic('medium');mode=m;opponent=null;searchSec=0;screen='search';showNav(false);renderContent();
    if(searchIv)clearInterval(searchIv);
    const t0=Date.now();
    searchIv=setInterval(function(){
      searchSec=Math.floor((Date.now()-t0)/1000);
      if(searchSec>=2+Math.floor(Math.random()*2)&&!opponent){
        clearInterval(searchIv);opponent=findOpp();haptic('success');renderContent();
        setTimeout(function(){startBattle(mode,opponent)},1000);
      } else if(searchSec>=60&&!opponent){clearInterval(searchIv);renderContent()}
      else if(!opponent){
        const el=document.getElementById('searchTimer');
        if(el){const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');el.textContent=mode+' · '+mm+':'+ss}
      }
    },400);
  }
  function cancelSearch(){if(searchIv)clearInterval(searchIv);haptic('light');go('arenas')}

  function startBattle(m,opp){
    opponent=opp;barVis=0;
    myScores=computeScores(user,m);oppScores=computeScores(opp,m);
    myOv=overallMode(myScores,m);oppOv=overallMode(oppScores,m);
    winnerId=myOv>=oppOv?user.id:opp.id;
    const reasons=[];const ws=winnerId===user.id?myScores:oppScores;const ls=winnerId===user.id?oppScores:myScores;
    if(ws.username>ls.username+.4)reasons.push('более сильный username');
    if(ws.gifts>ls.gifts+.4)reasons.push('более сильная коллекция Gifts');
    if(ws.giftValue>ls.giftValue+.4)reasons.push('выше ценность Gifts');
    if(ws.avatar>ls.avatar+.4)reasons.push('лучший аватар');
    if(!reasons.length)reasons.push('общий баланс профиля');
    commentary='Победа благодаря: '+reasons.slice(0,3).join(', ')+'.';
    tips=[];if(ls.avatar<7)tips.push('Улучши аватар');if(ls.username<7)tips.push('Сделай username чище');if(ls.bio<6)tips.push('Добавь описание профиля');if(ls.gifts<7)tips.push('Собери более редкие Gifts');if(!tips.length)tips.push('Продолжай в том же духе');
    screen='battle';showNav(false);haptic('medium');renderContent();
    let n=0;
    const iv=setInterval(function(){n++;barVis=n;renderContent();if(n>=7){clearInterval(iv);setTimeout(finishBattle,1000)}},800);
  }
  function finishBattle(){
    const isWin=winnerId===user.id;
    haptic(isWin?'success':'error');playSound(isWin?'win':'loss');applyPts(isWin);
    history.unshift({id:'b'+Date.now(),opponent:opponent.username,mode:mode,result:isWin?'WIN':'LOSS',ptsDelta:isWin?25:-25,date:new Date().toISOString().slice(0,10)});
    save();screen='result';showNav(false);renderContent();
  }

  // ===== RENDER CONTENT ONLY =====
  function renderArenas(){
    return '<div class="screen">'+
      '<div class="bb-wrap"><div class="bb-track" id="bbTrack">'+
        BB.map(b=>'<div class="bb" style="background:'+b.g+'"><div class="bb-title">'+b.title+'</div><div class="bb-sub">'+b.sub+'</div></div>').join('')+
      '</div><div class="dots">'+BB.map((_,i)=>'<div class="dot'+(i===bbIdx?' on':'')+'"></div>').join('')+'</div></div>'+
      '<div class="card" style="padding:13px 14px;margin-bottom:14px">'+
        '<div style="display:flex;align-items:center;gap:11px">'+
          avatarHTML(user.username,null,user.photoUrl,true)+
          '<div style="flex:1"><div style="font-weight:700;font-size:14px">@'+user.username+'</div>'+
          '<div style="display:flex;gap:7px;margin-top:3px;align-items:center"><span class="rank">'+user.rank+'</span><span class="muted">'+user.pts+' PTS</span></div>'+
          '<div class="online-badge" style="margin-top:3px"><i></i> онлайн</div></div>'+
          (user.winStreak>0?'<div style="text-align:center"><div style="font-size:15px">🔥</div><div style="font-weight:700;font-size:12px">'+user.winStreak+'</div></div>':'')+
        '</div></div>'+
      '<div class="card arena arena-larp"><div class="arena-title" style="color:#3dd6c6">LARP ARENA</div>'+
        '<div class="arena-desc">Битва коллекций Telegram Gifts. Редкость, дизайн, ценность.</div>'+
        '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'LARP\')">Начать подбор</button></div>'+
      '<div class="card arena arena-mog"><div class="arena-title" style="color:#4da3ff">MOG ARENA</div>'+
        '<div class="arena-desc">Полная оценка профиля: avatar, username, bio, gifts, age.</div>'+
        '<button class="btn btn-primary btn-block" onclick="App.startSearch(\'MOG\')">Начать подбор</button></div>'+
    '</div>';
  }

  function renderSearch(){
    const mm=String(Math.floor(searchSec/60));const ss=String(searchSec%60).padStart(2,'0');
    let extra='';
    if(opponent){
      extra='<div class="card" style="padding:14px;width:100%;text-align:center">'+avatarHTML(opponent.username,null,null,opponent.online)+
        '<div style="margin-top:7px;font-weight:700">@'+opponent.username+'</div><div class="muted">'+opponent.rank+' · '+opponent.pts+' PTS</div>'+
        (opponent.online?'<div class="online-badge" style="justify-content:center;margin-top:4px"><i></i> онлайн</div>':'')+'</div>';
    } else if(searchSec>=60){
      extra='<div class="muted" style="margin-bottom:10px">Соперник не найден</div>'+
        '<button class="btn btn-primary" onclick="App.startSearch(\''+mode+'\')">Попробовать ещё раз</button>'+
        '<button class="btn btn-ghost" style="margin-top:8px" onclick="App.go(\'arenas\')">Назад</button>';
    } else {
      extra='<button class="btn btn-danger" onclick="App.cancelSearch()">Отменить поиск</button>';
    }
    return '<div class="screen"><div class="search-wrap">'+
      '<div class="ring"><div class="ring-orbit"></div>'+avatarHTML(user.username,'avatar-lg',user.photoUrl,true)+'</div>'+
      '<div class="h2 '+(opponent?'':'pulse')+'">'+(opponent?'Соперник найден!':'Поиск соперника...')+'</div>'+
      '<div class="muted" id="searchTimer">'+mode+' · '+mm+':'+ss+'</div>'+extra+'</div></div>';
  }

  function renderBattle(){
    return '<div class="screen"><div style="text-align:center;margin-bottom:6px"><div class="h2">'+mode+' BATTLE</div><div class="muted pulse">Анализ профилей...</div></div>'+
      '<div class="vs-row"><div class="vs-player">'+avatarHTML(user.username,null,user.photoUrl,true)+
        '<div style="font-weight:700;margin-top:5px;font-size:12px">@'+user.username+'</div><div class="rank" style="margin-top:3px">'+user.rank+'</div>'+
        (barVis>=7?'<div class="score-big">'+myOv.toFixed(2)+'</div>':'')+'</div>'+
      '<div class="vs-badge">VS</div><div class="vs-player">'+avatarHTML(opponent.username,null,null,opponent.online)+
        '<div style="font-weight:700;margin-top:5px;font-size:12px">@'+opponent.username+'</div><div class="rank" style="margin-top:3px">'+opponent.rank+'</div>'+
        (barVis>=7?'<div class="score-big">'+oppOv.toFixed(2)+'</div>':'')+'</div></div>'+
      (barVis>0?'<div class="card" style="padding:12px;margin-top:6px"><div class="muted" style="margin-bottom:5px;font-size:11px">Анализ...</div>'+
        '<div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden">'+
        '<div style="height:100%;width:'+(Math.min(100,barVis*14))+'%;background:linear-gradient(90deg,#3d8bfd,#3dd6c6);border-radius:2px;transition:width .35s"></div></div></div>':'')+
    '</div>';
  }

  function renderResult(){
    const win=winnerId===user.id;
    return '<div class="screen"><div style="padding:18px 10px;margin:10px 0">'+
      '<div class="'+(win?'result-win':'result-loss')+'">'+(win?'🏆 WIN':'💀 LOSS')+'</div>'+
      '<div class="muted" style="margin-top:7px;text-align:center">'+(win?'+25':'-25')+' PTS → <b style="color:var(--text)">'+user.pts+' PTS</b></div>'+
      '<div style="margin-top:7px;text-align:center"><span class="rank'+(showRankUp?' rank-up':'')+'">'+user.rank+'</span>'+
      (user.winStreak>0?' <span style="margin-left:7px;font-size:13px">🔥 '+user.winStreak+'</span>':'')+'</div>'+
      (showRankUp?'<div class="muted" style="text-align:center;margin-top:5px;color:var(--cyan)">RANK UP!</div>':'')+
      '</div>'+
      '<div class="vs-row"><div class="vs-player"><div class="score-big">'+myOv.toFixed(2)+'</div><div class="muted">@'+user.username+'</div></div>'+
      '<div class="vs-badge">VS</div><div class="vs-player"><div class="score-big">'+oppOv.toFixed(2)+'</div><div class="muted">@'+opponent.username+'</div></div></div>'+
      '<div class="card" style="padding:13px;margin-bottom:10px"><div class="h2" style="margin-bottom:5px">Почему так?</div><div class="muted">'+commentary+'</div></div>'+
      '<div class="card" style="padding:13px;margin-bottom:14px"><div class="h2" style="margin-bottom:5px">Что улучшить</div>'+
        tips.map(t=>'<div class="muted" style="margin-bottom:3px">· '+t+'</div>').join('')+'</div>'+
      '<button class="btn btn-primary btn-block" onclick="App.go(\'arenas\')">На арену</button>'+
      '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="App.startSearch(\''+mode+'\')">Ещё битва</button></div>';
  }

  function renderProfile(){
    const nr=ptsToNext(user.pts);
    return '<div class="screen"><div class="profile-header">'+
      '<div style="position:relative">'+avatarHTML(user.username,'avatar-lg',user.photoUrl,true)+
        '<div class="avatar-orbit"></div></div>'+
      '<div class="h1">@'+user.username+'</div><div class="energy-line"></div>'+
      '<span class="rank">'+user.rank+'</span>'+
      '<div class="muted">'+user.pts+' PTS'+(user.winStreak>0?' · 🔥 '+user.winStreak:'')+'</div>'+
      '<div class="online-badge"><i></i> онлайн</div>'+
      (nr.next?'<div class="muted" style="font-size:12px">До '+nr.next+': '+nr.need+' PTS</div>':'')+
      '</div>'+
      '<div class="stat-grid">'+
        '<div class="card stat-box"><div class="stat-val">'+(user.overallScore||0).toFixed(2)+'</div><div class="stat-label">Overall</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.battlesPlayed+'</div><div class="stat-label">Battles</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.wins+'</div><div class="stat-label">Wins</div></div>'+
        '<div class="card stat-box"><div class="stat-val">'+user.losses+'</div><div class="stat-label">Losses</div></div></div>'+
      '<div class="card toggle" style="margin-bottom:12px" onclick="App.toggleHideLB()">'+
        '<div><div style="font-weight:600;font-size:13px">Скрыть из Leaderboard</div><div class="muted" style="font-size:11px">Когда появится Топ</div></div>'+
        '<div class="toggle-sw'+(user.hideFromLB?' on':'')+'"><div class="toggle-kn"></div></div></div>'+
      '<div class="h2" style="margin:4px 0 8px">История битв</div>'+
      history.slice(0,10).map(h=>
        '<div class="card hist"><div><div style="font-weight:600;font-size:13px">'+(h.result==='WIN'?'🏆':'💀')+' @'+h.opponent+'</div>'+
        '<div class="muted">'+h.mode+' · '+h.date+'</div></div>'+
        '<div style="font-weight:700;color:'+(h.result==='WIN'?'var(--win)':'var(--danger)')+'">'+(h.ptsDelta>0?'+':'')+h.ptsDelta+'</div></div>'
      ).join('')+'</div>';
  }

  function renderContent(){
    const box=document.getElementById('content');
    if(!box)return;
    let html='';
    if(screen==='arenas')html=renderArenas();
    else if(screen==='search')html=renderSearch();
    else if(screen==='battle')html=renderBattle();
    else if(screen==='result'){html=renderResult();showRankUp=false}
    else if(screen==='profile')html=renderProfile();
    box.innerHTML=html;

    const track=document.getElementById('bbTrack');
    if(track){
      track.onscroll=function(){
        bbIdx=Math.round(track.scrollLeft/track.clientWidth);
        document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===bbIdx));
      };
    }
  }

  // nav clicks
  document.getElementById('navArenas').onclick=function(){go('arenas')};
  document.getElementById('navProfile').onclick=function(){go('profile')};

  window.App={
    go:go,
    startSearch:startSearch,
    cancelSearch:cancelSearch,
    toggleHideLB:function(){user.hideFromLB=!user.hideFromLB;save();haptic('light');renderContent()}
  };

  setNav(0);
  renderContent();
})();
</script>
</body>
</html>
